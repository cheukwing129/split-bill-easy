<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>埋單有數</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" sizes="any">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@santi020k/lumen@3.0.0/styles.css">
<script type="module">
import { defineLumenCard } from "https://esm.sh/@santi020k/lumen-elements@3.0.0/components/card?bundle";
import { defineLumenBadge } from "https://esm.sh/@santi020k/lumen-elements@3.0.0/components/badge?bundle";
defineLumenCard();
defineLumenBadge();
</script>
<style>:root{
  color-scheme:light;
  --canvas:227 42% 96%;--surface:0 0% 100%;--surface-muted:220 14% 96%;--surface-strong:220 13% 91%;
  --line:228 22% 86%;--ink:222 35% 18%;--ink-soft:215 16% 32%;--ink-muted:215 12% 48%;
  --brand:246 75% 63%;--brand-solid:246 60% 54%;--brand-soft:246 100% 96%;--on-brand:0 0% 100%;
  --accent:163 72% 31%;--success:142 71% 36%;--warning:38 92% 50%;--danger:0 84% 60%;--on-danger:0 0% 100%;
  --ui-font:Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  --app-ink:#202747;--app-ink-soft:#344166;--muted:#68738f;--muted-light:#8992aa;
  --app-accent:#6558e8;--app-accent-dark:#5144d1;--app-accent-soft:#efedff;
  --app-line:rgba(77,88,134,.13);--mint:#16896c;--mint-soft:#e7f7f1;
  --amber:#a65c27;--amber-soft:#fff2e6;--app-surface:rgba(255,255,255,.64);
  --bg:#f4f5fb;--shadow:0 18px 48px rgba(39,48,92,.09),inset 0 1px 0 rgba(255,255,255,.92);
  --shadow-small:0 8px 24px rgba(39,48,92,.07),inset 0 1px 0 rgba(255,255,255,.92)
}
*{box-sizing:border-box}
lumen-card{display:block}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#f4f5fb}
body{
  position:relative;isolation:isolate;
  margin:0;min-height:100vh;color:var(--app-ink);background:transparent;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  font-size:17px;line-height:1.5;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse at 8% 7%,rgba(145,132,255,.46) 0,rgba(145,132,255,.18) 22rem,transparent 43rem),
    radial-gradient(ellipse at 94% 28%,rgba(79,205,183,.37) 0,rgba(79,205,183,.14) 22rem,transparent 42rem),
    radial-gradient(ellipse at 54% 78%,rgba(175,148,255,.40) 0,rgba(175,148,255,.17) 22rem,transparent 43rem),
    radial-gradient(ellipse at 63% 9%,rgba(255,255,255,.72) 0,transparent 34rem),
    linear-gradient(135deg,#f2efff 0%,#eef2fb 47%,#e9f7f3 100%)
}
#app{width:min(100%,1040px);margin:0 auto;padding:clamp(18px,4vw,42px) clamp(16px,4vw,34px) 64px}
h1,h2,h3,p{margin-top:0}
h1,h2{color:var(--app-ink);letter-spacing:-.025em}
h1{font-size:clamp(30px,5vw,42px);line-height:1.12;font-weight:750;margin-bottom:0}
h2{font-size:22px;line-height:1.2;font-weight:700;margin:0}
p.sub{color:var(--muted);font-size:15px;line-height:1.55;margin:8px 0 20px}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.amt{font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.surface,.card{background:var(--app-surface);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,.72);border-radius:20px;box-shadow:var(--shadow-small)}
.card{padding:22px;margin:0 0 18px}
button{font-family:inherit;font-size:15px;font-weight:650;line-height:1.2;border:1px solid transparent;border-radius:12px;padding:11px 15px;cursor:pointer;transition:transform .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:focus-visible,input:focus-visible{outline:3px solid rgba(101,88,232,.3);outline-offset:2px}
button:disabled{opacity:.58;cursor:wait}
.btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;padding:14px 18px;color:#fff;background:linear-gradient(135deg,#7568f2,#584bd9);box-shadow:0 8px 18px rgba(101,88,232,.24);font-weight:750}
.btn-main:hover:not(:disabled){background:linear-gradient(135deg,#8176f6,#6255e4);box-shadow:0 10px 22px rgba(101,88,232,.3)}
.btn-sm{min-height:36px;padding:8px 12px;background:rgba(255,255,255,.68);border:1px solid rgba(89,100,150,.18);color:var(--app-ink-soft);font-size:14px;font-weight:650;box-shadow:0 2px 8px rgba(44,52,90,.04)}
.btn-sm:hover:not(:disabled){background:#fff;border-color:rgba(101,88,232,.35);color:var(--app-accent)}
.btn-sm.danger{color:#ad5360}
.btn-ghost{background:transparent;color:var(--app-accent);font-size:14px;padding:5px 2px;text-decoration:none;border:0;border-radius:8px;font-weight:700}
.btn-ghost:hover{background:var(--app-accent-soft);color:var(--app-accent-dark)}
input[type=text],input[type=number]{display:block;width:100%;min-height:48px;padding:13px 14px;margin:6px 0 16px;border:1px solid rgba(86,96,143,.18);border-radius:12px;background:rgba(255,255,255,.92);color:var(--app-ink);font-family:inherit;font-size:17px;font-weight:500;line-height:1.3;transition:border-color .16s ease,box-shadow .16s ease}
input[type=text]:focus,input[type=number]:focus{border-color:rgba(101,88,232,.65);box-shadow:0 0 0 4px rgba(101,88,232,.09);outline:0}
input::placeholder{color:#9098ad;opacity:1}
label{display:block;font-size:14px;font-weight:700;color:var(--app-ink-soft);margin:9px 0 5px}
.home-shell{max-width:760px;margin:clamp(12px,4vh,42px) auto 0}
.home-hero,.meeting-hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;background:linear-gradient(128deg,#1f294d 0%,#3d3b7c 54%,#6657ce 100%);border:1px solid rgba(255,255,255,.32);border-radius:28px;box-shadow:0 24px 62px rgba(48,51,109,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.home-hero{min-height:340px;padding:clamp(26px,5vw,44px);margin-bottom:18px}
.home-hero::before,.meeting-hero::before{content:"";position:absolute;z-index:0;width:390px;height:390px;border-radius:50%;right:-110px;top:-178px;background:radial-gradient(circle,rgba(190,184,255,.38),rgba(157,146,255,.08) 54%,transparent 72%);filter:blur(2px);pointer-events:none}
.home-hero::after,.meeting-hero::after{content:"";position:absolute;z-index:0;width:300px;height:300px;border-radius:50%;right:16%;bottom:-240px;background:radial-gradient(circle,rgba(124,230,204,.18),transparent 68%);pointer-events:none}
.home-hero>*,.meeting-hero>*{position:relative;z-index:1}
.home-brand,.meeting-brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.01em}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;color:white;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-size:21px;backdrop-filter:blur(12px)}
.brand-badge{display:inline-flex;align-items:center;margin-left:4px;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.19);background:rgba(255,255,255,.09);color:rgba(255,255,255,.82);font-size:11px;letter-spacing:.12em;font-weight:700}
.home-hero-copy{max-width:62%;margin-top:34px}
.brand-eyebrow{font-size:12px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);margin:0 0 12px}
.home-title{max-width:540px;color:#fff;font-size:clamp(36px,7vw,58px);line-height:1.06;letter-spacing:-.04em;font-weight:780}
.home-lead{max-width:42ch;color:rgba(255,255,255,.82);font-size:17px;line-height:1.65;margin:16px 0 0}
.hero-glass-card{position:absolute!important;right:34px;bottom:34px;width:218px;padding:17px 18px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.24);box-shadow:0 16px 40px rgba(11,17,51,.16),inset 0 1px 0 rgba(255,255,255,.26);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.hero-glass-card small{display:block;color:rgba(255,255,255,.8);font-size:12px;margin-bottom:7px}
.hero-glass-card strong{display:block;color:#fff;font-size:20px;letter-spacing:-.02em}
.hero-glass-card span{display:inline-flex;align-items:center;gap:6px;margin-top:11px;color:rgba(255,255,255,.86);font-size:13px}
.hero-glass-card span::before{content:"";width:7px;height:7px;border-radius:50%;background:#7be0be;box-shadow:0 0 12px rgba(123,224,190,.65)}
.home-card{padding:clamp(20px,4vw,30px);margin-bottom:14px}
.card-heading{display:flex;align-items:center;gap:13px;margin:0 0 21px}
.card-heading-icon{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border:1px solid rgba(101,88,232,.14);border-radius:15px;background:var(--app-accent-soft);color:var(--app-accent);font-size:22px}
.card-heading-copy{display:flex;flex-direction:column;gap:3px}
.card-heading-copy strong{font-size:19px;font-weight:750;color:var(--app-ink);letter-spacing:-.02em}
.card-heading-copy .small{font-size:13px}
.home-submit{justify-content:space-between;padding-inline:18px}
.home-submit span:last-child{font-size:20px;line-height:1}
.home-note{display:flex;align-items:flex-start;gap:10px;padding:13px 4px 0;margin:0;color:var(--muted);line-height:1.55}
.home-note-icon{display:grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:8px;background:var(--mint-soft);color:var(--mint);font-size:14px;font-weight:800}
.meeting-page{max-width:920px;margin:0 auto}
.meeting-hero{padding:clamp(20px,4vw,34px);margin-bottom:20px}
.meeting-topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meeting-brand{color:#fff;font-size:15px}
.meeting-brand small{color:rgba(255,255,255,.75);font-weight:500}
.meeting-brand .brand-mark{width:34px;height:34px;border-radius:11px;font-size:18px}
.btn-share{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:9px 12px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.23);border-radius:11px;font-size:13px;font-weight:700;backdrop-filter:blur(10px)}
.btn-share:hover:not(:disabled){background:rgba(255,255,255,.2)}
.meeting-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.meeting-actions .btn-share{flex:0 0 auto;white-space:nowrap}
.btn-new-meeting svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meeting-heading-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:25px 0 21px}
.meeting-heading-row h1{color:#fff;font-size:clamp(27px,4.5vw,38px);overflow-wrap:anywhere}
.meeting-caption{color:rgba(255,255,255,.78);font-size:14px;margin:8px 0 0}
.meeting-live-tag{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;color:rgba(255,255,255,.94);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);font-size:12px;font-weight:700}
.meeting-live-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#74dfb8;box-shadow:0 0 12px rgba(116,223,184,.68)}
.meeting-live-tag.is-archived::before{background:#ffd28a;box-shadow:none}
.meeting-stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px}
.stat-tile{min-width:0;padding:13px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.19);background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stat-tile span{display:block;color:rgba(255,255,255,.82);font-size:12px;font-weight:650}
.stat-tile strong{display:block;color:#fff;font-size:clamp(17px,3vw,24px);line-height:1.25;font-weight:780;letter-spacing:-.025em;margin-top:5px;overflow-wrap:anywhere}
.stat-tile .stat-hint{color:rgba(255,255,255,.75);font-size:11px;margin-top:3px}
.warn,.notice{padding:13px 15px;border-radius:14px;background:rgba(255,246,229,.9);border:1px solid rgba(209,153,76,.24);color:#67451f;font-size:14px;line-height:1.5;margin:0 0 16px}
.tabs{display:flex;gap:5px;width:max-content;max-width:100%;padding:5px;margin:0 0 20px;border:1px solid rgba(255,255,255,.86);border-radius:15px;background:rgba(255,255,255,.63);box-shadow:0 8px 20px rgba(39,48,92,.06);backdrop-filter:blur(16px)}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 17px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.62);color:var(--app-ink)}
.tab.active{background:#fff;color:var(--app-accent-dark);box-shadow:0 3px 10px rgba(49,53,106,.1)}
.tab-icon{display:inline-flex;width:17px;height:17px;align-items:center;justify-content:center}
.tab-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0 0 19px;align-items:start}
.add-section{min-width:0}
.add-section-toggle{display:flex;align-items:center;justify-content:flex-start;gap:11px;width:100%;min-height:64px;margin:0;padding:13px 16px;border:1px solid rgba(255,255,255,.22);border-radius:17px;color:#fff;background:linear-gradient(135deg,#273253,#464477);text-align:left;font-family:inherit;font-size:16px;font-weight:750;line-height:1.25;box-shadow:0 10px 23px rgba(38,46,87,.15),inset 0 1px 0 rgba(255,255,255,.12)}
.add-section:nth-child(2) .add-section-toggle{background:linear-gradient(135deg,#554caa,#766be0)}
.add-section-toggle:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
.add-section-toggle-icon{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:11px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-size:21px;font-weight:450}
.add-section-toggle-icon:empty{display:none}
.add-form-card{display:block;margin:12px 0 0;padding:17px;border-radius:17px}
.add-form-card .row{gap:9px}
.pill{display:inline-flex;align-items:center;max-width:100%;white-space:normal;overflow-wrap:anywhere;margin:3px 5px 3px 0;padding:7px 11px;border:1px solid rgba(91,101,148,.17);border-radius:999px;background:rgba(255,255,255,.78);color:var(--app-ink-soft);font-size:14px;font-weight:650;transition:background-color .16s ease,border-color .16s ease,color .16s ease}
.pill.on{background:var(--app-accent-soft);color:var(--app-accent-dark);border-color:rgba(101,88,232,.24)}
.checkline{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--app-ink-soft)}
.checkline input{accent-color:var(--app-accent);width:18px;height:18px}
.people-card{padding:19px 20px;margin:0 0 20px}
.people-card-header,.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.people-card-header{margin-bottom:15px}
.people-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:750}
.people-count{padding:4px 8px;border-radius:999px;background:var(--app-accent-soft);color:var(--app-accent-dark);font-size:12px;font-weight:750}
.participant-list{display:flex;flex-wrap:wrap;gap:8px}
.participant-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 11px 7px 7px;border:1px solid rgba(81,94,143,.12);border-radius:999px;background:rgba(255,255,255,.56);color:var(--app-ink-soft);font-size:14px;font-weight:650;overflow-wrap:anywhere}
.avatar-mini{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:linear-gradient(145deg,#e8e5ff,#d9f1ec);color:var(--app-accent-dark)}
.avatar-mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar-mini.avatar-emoji{font-size:16px;line-height:1}
.balance-card .avatar-mini.avatar-emoji{font-size:19px}
.participant-manage-name{display:flex;align-items:center;gap:9px;min-width:0;font-weight:650}
.participant-edit-form{padding:14px;margin:8px 0;border:1px solid rgba(101,88,232,.18);border-radius:15px;background:rgba(255,255,255,.62)}
.participant-edit-form>label:first-child{margin-top:0}
.avatar-picker{margin:10px 0 18px}
.avatar-picker-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}
.avatar-picker-heading b{font-size:14px;color:var(--app-ink-soft)}
.avatar-picker-options{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.avatar-choice{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:42px;min-height:42px;padding:6px 9px;border:1px solid rgba(86,96,143,.17);border-radius:12px;background:rgba(255,255,255,.75);color:var(--app-ink-soft);font-size:19px}
.avatar-choice:hover:not(:disabled){background:#fff;border-color:rgba(101,88,232,.36);color:var(--app-accent-dark)}
.avatar-choice.selected{border-color:rgba(101,88,232,.58);background:var(--app-accent-soft);box-shadow:0 0 0 2px rgba(101,88,232,.1);color:var(--app-accent-dark)}
.avatar-choice-default,.avatar-choice-random{font-size:12px;font-weight:700}
.avatar-choice-default .avatar-mini{width:24px;height:24px;flex-basis:24px}
.avatar-hint{margin:7px 0 0;font-size:12px}
.people-manage{padding:17px 19px;margin:-7px 0 20px}
.people-manage .row{padding:10px 0;border-bottom:1px solid var(--app-line)}
.people-manage .row:last-child{border-bottom:0}
.participant-edit-row{padding:0 0 8px;margin:0 0 8px;border-bottom:1px solid var(--app-line)}
.participant-edit-row:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}
.pill .avatar-mini,.checkline .avatar-mini{width:23px;height:23px;flex-basis:23px}
.pill .avatar-mini svg,.checkline .avatar-mini svg{width:12px;height:12px}
.pill .avatar-mini.avatar-emoji,.checkline .avatar-mini.avatar-emoji{font-size:14px}
.section-heading{margin:26px 2px 12px}
.section-heading p{margin:4px 0 0;color:var(--muted);font-size:13px}
.section-count{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(87,97,142,.12);color:var(--muted);font-size:12px;font-weight:700}
.expense-list{padding:5px 18px}
.exp-item{display:flex;align-items:flex-start;gap:13px;padding:16px 2px;border-bottom:1px solid var(--app-line)}
.exp-item:first-child{padding-top:13px}
.exp-item:last-child{border-bottom:0}
.expense-icon{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#efedff,#e5f5f0);color:var(--app-accent)}
.expense-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.expense-main{flex:1;min-width:0}
.expense-head{align-items:flex-start;gap:10px}
.expense-head b{min-width:0;font-size:15px;font-weight:750;overflow-wrap:anywhere}
.exp-item .amt{flex:0 0 auto;font-size:16px;white-space:nowrap;color:var(--app-ink)}
.expense-meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px 11px;margin-top:7px}
.meta-tag{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.meta-dot{width:6px;height:6px;border-radius:50%;background:#887dee}
.share-toggle{padding:0;border:0;background:transparent;color:var(--app-accent-dark);font-size:12px;font-weight:700;text-align:left}
.share-toggle:hover:not(:disabled){background:transparent;text-decoration:underline}
.share-names{margin-top:8px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.expense-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;padding:22px;text-align:center}
.empty-icon{display:grid;place-items:center;width:46px;height:46px;margin-bottom:10px;border-radius:16px;background:var(--app-accent-soft);color:var(--app-accent);font-size:21px}

async function waitFb(){
  let tries=0;

let S={meeting:null,expId:null,expenses:[],transfers:[],view:'home',
  showAdd:false,editExpenseId:null,showPeople:false,splitSyncKey:'',newExpense:null,
  showAddPerson:false,newParticipantName:'',newParticipantEmoji:'',editParticipant:null,showTransitPicker:false};
let addingParticipant=false;
let renamingParticipant=false;

function cents(v){return Math.round(parseFloat(v||0)*100)||0;}
function fmt(c){const n=c<0;c=Math.abs(c);return (n?'－':'')+'HK$'+(c/100).toFixed(2);}
function meetingId(){const m=location.hash.match(/#\/m\/([^\/]+)/);return m?m[1]:null;}
let expenseSaving=false;
const markingTransferKeys=new Set();
function transferKey(from,to,amount){return JSON.stringify([meetingId(),from,to,Math.round(Number(amount))]);}
function stableRows(rows,map){
  return rows.map(map).sort((a,b)=>{
    const x=JSON.stringify(a),y=JSON.stringify(b);
    return x<y?-1:x>y?1:0;
  });
}
async function paidTransferId(from,to,amount){
  const state=JSON.stringify({
    meeting:meetingId(),
    participants:(S.meeting?.participants||[]).map(p=>p.name),
    expenses:stableRows(S.expenses,e=>[e.id,e.payer,e.amount,[...(e.shareWith||[])].sort()]),
    transfers:stableRows(S.transfers,t=>[t.id,t.from,t.to,t.amount]),
    payment:[from,to,Math.round(Number(amount))]
  });
  const digest=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(state));
  const hex=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
  return 'paid_'+hex;
}

function splitAmount(amountCents,namesOrdered,transit,priorOwed={}){
  const n=namesOrdered.length; if(n===0)return{};
  const r={};
  if(transit&&namesOrdered.includes(transit)&&n>1){
    const equalShare=Math.min(Math.ceil(amountCents/n),Math.floor(amountCents/(n-1)));
    namesOrdered.forEach(nm=>{r[nm]=nm===transit?amountCents-equalShare*(n-1):equalShare;});
    return r;
  }
  const base=Math.floor(amountCents/n), rem=amountCents-base*n;
  namesOrdered.forEach(nm=>{r[nm]=base;});
  // 中轉人未參與時，無法同時讓每人同額並精確加總；尾數優先分給累積應付較少的人。
  const extraRecipients=transit?[...namesOrdered].sort((a,b)=>(priorOwed[a]||0)-(priorOwed[b]||0)||namesOrdered.indexOf(a)-namesOrdered.indexOf(b)):namesOrdered;
  for(let i=0;i<rem;i++) r[extraRecipients[i]]+=1;
  return r;
}
function calculateBalancesFor(meeting,expenses,transit){
  const names=(meeting.participants||[]).map(p=>p.name);
  const paid={},owed={}; names.forEach(n=>{paid[n]=0;owed[n]=0;});
  expenses.forEach(e=>{
    paid[e.payer]=(paid[e.payer]||0)+e.amount;
    const shares=Array.isArray(e.shareWith)?e.shareWith:[];
    const order=names.filter(n=>shares.includes(n));
    const sp=splitAmount(e.amount,order,transit,owed);
    order.forEach(n=>{owed[n]=(owed[n]||0)+sp[n];});
  });
  const net={}; names.forEach(n=>{net[n]=(paid[n]||0)-(owed[n]||0);});
  return {names,paid,owed,net};
}
function computeBalances(meeting,expenses){
  const explicitTransit=meeting.transitId;
  const names=(meeting.participants||[]).map(p=>p.name);
  if(explicitTransit&&names.includes(explicitTransit)){
    return {...calculateBalancesFor(meeting,expenses,explicitTransit),transit:explicitTransit};
  }
  const baseline=calculateBalancesFor(meeting,expenses,null);
  const transit=defaultTransit(names,baseline.net);
  return {...calculateBalancesFor(meeting,expenses,transit),transit};
}
function defaultTransit(names,net){
  if(!names.length)return null;
  let best=names[0]; names.forEach(n=>{if(net[n]>net[best])best=n;}); return best;
}
function remainingNet(net,transfers){
  const r={...net};
  transfers.forEach(t=>{r[t.from]=(r[t.from]||0)+t.amount;r[t.to]=(r[t.to]||0)-t.amount;});
  return r;
}
function pendingTransfers(names,transit,rnet){
  const list=[];
  names.forEach(n=>{if(n===transit)return;const v=Math.round(rnet[n]);
    if(v<0)list.push({from:n,to:transit,amount:-v});
    else if(v>0)list.push({from:transit,to:n,amount:v});
  });
  return list;
}

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsArg(value){return `decodeURIComponent('${encodeURIComponent(String(value??'')).replace(/'/g,'%27')}')`;}
function defaultAllExpenseStatus(e,participants){
  const people=participants||[];
  const created=Number(e.createdAt);
  const existed=people.filter(p=>!Number.isFinite(Number(p.joinedAt))||!Number.isFinite(created)||Number(p.joinedAt)<=created).map(p=>p.name);
  const shares=Array.isArray(e.shareWith)?e.shareWith:[];
  const currentNames=new Set(people.map(p=>p.name));
  const later=people.filter(p=>Number.isFinite(Number(p.joinedAt))&&Number.isFinite(created)&&Number(p.joinedAt)>created);
  const latestJoinAt=later.reduce((latest,p)=>Math.max(latest,Number(p.joinedAt)),-Infinity);
  const olderLateJoinMissing=later.some(p=>Number(p.joinedAt)<latestJoinAt&&!shares.includes(p.name));
  const baseIsAll=existed.length>0&&existed.every(n=>shares.includes(n))&&shares.every(n=>currentNames.has(n));
  return {isDefaultAll:baseIsAll&&!olderLateJoinMissing,awaitingEarlierJoin:baseIsAll&&olderLateJoinMissing};
}
function isDefaultAllExpense(e,participants){return defaultAllExpenseStatus(e,participants).isDefaultAll;}
async function syncAllSplitExpenses(id,participants,archived){
  if(archived||!participants.length) return;
  const key=id+':'+participants.map(p=>p.name).join('|');
  if(S.splitSyncKey===key) return;
  S.splitSyncKey=key;
  let retryAfterExpenseUpdate=false;
  try{
    const snap=await window.fb.getDocs(window.fb.collection(db,'meetings',id,'expenses'));
    const names=participants.map(p=>p.name), batch=window.fb.writeBatch(db); let writes=0;
    snap.forEach(d=>{
      const e=d.data(), status=defaultAllExpenseStatus(e,participants);
      if(!status.isDefaultAll){if(status.awaitingEarlierJoin) retryAfterExpenseUpdate=true;return;}
      const shares=Array.isArray(e.shareWith)?e.shareWith:[];
      const missing=names.filter(n=>!shares.includes(n));
      if(missing.length){batch.update(d.ref,{shareWith:window.fb.arrayUnion(...missing)});writes++;}
    });
    if(writes) await batch.commit();
    if(retryAfterExpenseUpdate&&S.splitSyncKey===key) S.splitSyncKey='';
  }catch(err){S.splitSyncKey='';console.error('同步預設分攤失敗',err);}
}

      showAddPerson:false,newParticipantName:'',newParticipantEmoji:'',editParticipant:null,showTransitPicker:false};
    render();

  }
  db = db || await waitFb();
  if(!db){ document.getElementById('app').innerHTML='<p class="warn">尚未連上資料庫：請在程式碼開頭填入你的 Firebase 設定（firebaseConfig）。</p>'; return; }
  if(!id){ S={meeting:null,view:'home'}; renderHome(); return; }
  if(S.meeting?.id!==id){ S.view='home'; S.showTransitPicker=false; }
  const chooseDefaultView=S.view==='home';
  renderLoading();
  const mref = window.fb.doc(db,'meetings',id);
  unsub.push(window.fb.onSnapshot(mref, snap=>{
    if(!snap.exists()){ S.meeting=false; render(); return; }
    S.meeting={id, ...snap.data()};
    if(!Array.isArray(S.meeting.participants)) S.meeting.participants=[];
    if(chooseDefaultView&&S.view==='home') S.view=S.meeting.participants.length?'settle':'ledger';
    render();
    syncAllSplitExpenses(id,S.meeting.participants,S.meeting.archived);
  }, err=>{ S.meeting=false; render(); }));
  const expQ = window.fb.query(window.fb.collection(db,'meetings',id,'expenses'), window.fb.orderBy('createdAt','asc'));
  unsub.push(window.fb.onSnapshot(expQ, snap=>{
    S.expenses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  const trCol = window.fb.collection(db,'meetings',id,'transfers');
  unsub.push(window.fb.onSnapshot(trCol, snap=>{
    S.transfers = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }));
  render();
}

async function copyMeetingLink(button){
  const link=window.location.href;
  let copied=false;
  if(navigator.clipboard&&window.isSecureContext){
    try{await navigator.clipboard.writeText(link);copied=true;}catch(err){}
  }
  if(!copied){
    try{
      const field=document.createElement('textarea');
      field.value=link; field.setAttribute('readonly','');
      field.style.position='fixed'; field.style.left='-9999px'; field.style.top='0';
      document.body.appendChild(field); field.select();
      copied=document.execCommand('copy');
      field.remove();
    }catch(err){}
  }
  if(copied){
    const previous=button.textContent;
    button.textContent='已複製 ✓';
    window.setTimeout(()=>{if(button.isConnected)button.textContent=previous;},1800);
  }else{
    window.prompt('無法自動複製，請手動複製聚會連結：',link);
  }
}

async function addParticipant(name,emoji=''){
  const id=meetingId(), mref=window.fb.doc(db,'meetings',id);
  try{
    const participants=await window.fb.runTransaction(db,async transaction=>{
      const snap=await transaction.get(mref);
      if(!snap.exists()) throw new Error('meeting-not-found');
      const live=snap.data(), current=Array.isArray(live.participants)?live.participants:[];
      if(live.archived) throw new Error('meeting-archived');
      if(current.some(p=>p.name===name)) throw new Error('duplicate-name');
      const participant={name,joinedAt:Date.now()};
      const avatarEmoji=safeParticipantEmoji(emoji);
      if(avatarEmoji) participant.emoji=avatarEmoji;
      const next=[...current,participant];
      transaction.update(mref,{participants:next});
      return next;
    });
    S.meeting={...S.meeting,participants};
    render();
    syncAllSplitExpenses(id,participants,false);
    return true;
  }catch(err){
    if(err.message==='duplicate-name') alert('這個名字已被使用，請選其他名稱或直接選取。');
    else if(err.message==='meeting-archived') alert('此聚會已封存，無法新增參加者。');
    else alert('新增參加者失敗，請檢查網絡後再試。');
    return false;
  }
}

async function saveParticipantChanges(){
  if(renamingParticipant||!S.editParticipant) return;
  const edit={...S.editParticipant}, originalName=edit.originalName, newName=(edit.draftName||'').trim(), emoji=safeParticipantEmoji(edit.emoji);
  if(!newName){alert('請輸入參加者名稱');return;}
  const currentParticipant=(S.meeting.participants||[]).find(p=>p.name===originalName);
  if(!currentParticipant){alert('參加者名單已更新，請重新整理後再試。');return;}
  if(newName!==originalName&&(S.meeting.participants||[]).some(p=>p.name===newName)){alert('這個名字已被使用。');return;}
  if(newName===originalName&&emoji===safeParticipantEmoji(currentParticipant.emoji)){
    S.editParticipant=null; render(); return;
  }
  renamingParticipant=true; render();
  const id=meetingId(), meetingRef=window.fb.doc(db,'meetings',id);
  try{
    const [expenseSnap,transferSnap]=await Promise.all([
      window.fb.getDocs(window.fb.collection(db,'meetings',id,'expenses')),
      window.fb.getDocs(window.fb.collection(db,'meetings',id,'transfers'))
    ]);
    const expenseRefs=expenseSnap.docs.map(d=>d.ref), transferRefs=transferSnap.docs.map(d=>d.ref);
    const result=await window.fb.runTransaction(db,async transaction=>{
      const meetingSnap=await transaction.get(meetingRef);
      if(!meetingSnap.exists()) throw new Error('meeting-not-found');
      const live=meetingSnap.data(), current=Array.isArray(live.participants)?live.participants:[];
      if(live.archived) throw new Error('meeting-archived');
      if(!current.some(p=>p.name===originalName)) throw new Error('participant-not-found');
      if(newName!==originalName&&current.some(p=>p.name===newName)) throw new Error('duplicate-name');
      const [expenseDocs,transferDocs]=await Promise.all([
        Promise.all(expenseRefs.map(ref=>transaction.get(ref))),
        Promise.all(transferRefs.map(ref=>transaction.get(ref)))
      ]);
      const participants=current.map(p=>p.name===originalName?applyParticipantEmoji({...p,name:newName},emoji):p);
      const transitId=live.transitId===originalName?newName:(live.transitId||null);
      transaction.update(meetingRef,{participants,...(live.transitId===originalName?{transitId:newName}:{})});
      const expenses=expenseDocs.filter(s=>s.exists()).map(s=>{
        const e={id:s.id,...s.data()}, patch={};
        if(e.payer===originalName) patch.payer=newName;
        if((e.shareWith||[]).includes(originalName)) patch.shareWith=e.shareWith.map(n=>n===originalName?newName:n);
        if(Object.keys(patch).length) transaction.update(s.ref,patch);
        return {...e,...patch};
      });
      const transfers=transferDocs.filter(s=>s.exists()).map(s=>{
        const t={id:s.id,...s.data()}, patch={};
        if(t.from===originalName) patch.from=newName;
        if(t.to===originalName) patch.to=newName;
        if(Object.keys(patch).length) transaction.update(s.ref,patch);
        return {...t,...patch};
      });
      return {participants,transitId,expenses,transfers};
    });
    S.meeting={...S.meeting,participants:result.participants,transitId:result.transitId};
    S.expenses=S.expenses.map(e=>({...e,payer:e.payer===originalName?newName:e.payer,shareWith:(e.shareWith||[]).map(n=>n===originalName?newName:n)}));
    S.transfers=S.transfers.map(t=>({...t,from:t.from===originalName?newName:t.from,to:t.to===originalName?newName:t.to}));
    S.editParticipant=null;
  }catch(err){
    const messages={
      'duplicate-name':'這個名字已被使用。',
      'participant-not-found':'參加者名單已更新，找不到這個名字，請重新整理後再試。',
      'meeting-archived':'此聚會已封存，無法修改。',
      'meeting-not-found':'找不到這場聚會。'
    };
    alert(messages[err.message]||'修改參加者失敗，請檢查網絡後再試。');
  }finally{
    renamingParticipant=false;
    render();
  }
}
async function removeParticipant(name){
  const id=meetingId(), meetingRef=window.fb.doc(db,'meetings',id);
  try{
    const [expenseSnap,transferSnap]=await Promise.all([
      window.fb.getDocs(window.fb.collection(db,'meetings',id,'expenses')),
      window.fb.getDocs(window.fb.collection(db,'meetings',id,'transfers'))
    ]);
    const expenseRefs=expenseSnap.docs.map(d=>d.ref), transferRefs=transferSnap.docs.map(d=>d.ref);
    const initialExpenses=expenseSnap.docs.map(d=>({id:d.id,...d.data()}));
    const initialTransfers=transferSnap.docs.map(d=>({id:d.id,...d.data()}));
    if(initialExpenses.some(e=>e.payer===name)){alert('此人曾付款。請先修改或刪除由此人付款的花費，再移除此人。');return;}
    if(initialTransfers.some(t=>t.from===name||t.to===name)){alert('此人已有已付款轉帳紀錄。請先取消相關付款標記，再移除此人。');return;}
    const initialAffected=initialExpenses.filter(e=>(e.shareWith||[]).includes(name));
    if(initialAffected.some(e=>(e.shareWith||[]).filter(n=>n!==name).length===0)){alert('有花費只分攤給此人。請先修改或刪除該花費，再移除此人。');return;}
    if(!confirm('移除 '+name+'？此人會從 '+initialAffected.length+' 筆花費的分攤名單中移除，其他人的分攤會重新計算。')) return;
    const result=await window.fb.runTransaction(db,async transaction=>{
      const meetingSnap=await transaction.get(meetingRef);
      if(!meetingSnap.exists()) throw new Error('meeting-not-found');
      const live=meetingSnap.data(), current=Array.isArray(live.participants)?live.participants:[];
      if(live.archived) throw new Error('meeting-archived');
      if(!current.some(p=>p.name===name)) throw new Error('participant-not-found');
      const [expenseDocs,transferDocs]=await Promise.all([
        Promise.all(expenseRefs.map(ref=>transaction.get(ref))),
        Promise.all(transferRefs.map(ref=>transaction.get(ref)))
      ]);
      const expenses=expenseDocs.filter(s=>s.exists()).map(s=>({id:s.id,...s.data(),ref:s.ref}));
      const transfers=transferDocs.filter(s=>s.exists()).map(s=>({id:s.id,...s.data()}));
      if(expenses.some(e=>e.payer===name)) throw new Error('remove-has-payer');
      if(transfers.some(t=>t.from===name||t.to===name)) throw new Error('remove-has-transfer');
      const affected=expenses.filter(e=>(e.shareWith||[]).includes(name));
      if(affected.some(e=>(e.shareWith||[]).filter(n=>n!==name).length===0)) throw new Error('remove-only-share');
      const participants=current.filter(p=>p.name!==name);
      const transitId=live.transitId===name?null:(live.transitId||null);
      transaction.update(meetingRef,{participants,transitId});
      affected.forEach(e=>transaction.update(e.ref,{shareWith:e.shareWith.filter(n=>n!==name)}));
      return {participants,transitId,expenses};
    });
    S.meeting={...S.meeting,participants:result.participants,transitId:result.transitId};
    S.expenses=S.expenses.map(e=>({...e,shareWith:(e.shareWith||[]).filter(n=>n!==name)}));
    render();
  }catch(err){
    const messages={
      'remove-has-payer':'此人曾付款。請先修改或刪除由此人付款的花費，再移除此人。',
      'remove-has-transfer':'此人已有已付款轉帳紀錄。請先取消相關付款標記，再移除此人。',
      'remove-only-share':'有花費只分攤給此人。請先修改或刪除該花費，再移除此人。',
      'participant-not-found':'參加者名單已更新，找不到這個名字，請重新整理後再試。',
      'meeting-archived':'此聚會已封存，無法移除參加者。',
      'meeting-not-found':'找不到這場聚會。'
    };
    alert(messages[err.message]||'移除參加者失敗，請檢查網絡後再試。');
  }
}
function renderAddExpenseForm(m){
  const ne=S.newExpense;
  let html = `<lumen-card variant="glass" glass="strong" class="add-form-card" id="expenseAddForm" role="group" aria-label="新增花費">
    <label>項目名稱</label><input type="text" id="ex_item" value="${esc(ne.item)}">
    <label>金額（HK$）</label><input type="number" step="0.01" id="ex_amount" value="${esc(ne.amount)}">
    <label>實際付款人</label>
    <div>`;
  m.participants.forEach(p=>{
    html += `<span class="pill ${ne.payer===p.name?'on':''}" style="cursor:pointer" onclick="setPayer(${jsArg(p.name)})">${renderParticipantAvatar(p)}<span>${esc(p.name)}</span></span>`;
  });
  html += `</div>`;
  if(!ne.editShare){
    html += `<p class="small" style="margin-top:10px">分攤對象：${ne.shareWith.length===m.participants.length?'全體 '+m.participants.length+' 人':ne.shareWith.length+' 人'} · <span class="btn-ghost" style="cursor:pointer" onclick="toggleEditShare()">更改</span></p>`;
  } else {
    html += `<p class="small" style="margin-top:10px">分攤對象 · <span class="btn-ghost" style="cursor:pointer" onclick="selectAllShare()">全選</span> · <span class="btn-ghost" style="cursor:pointer" onclick="toggleEditShare()">收起</span></p>`;
    m.participants.forEach(p=>{
      const checked = ne.shareWith.includes(p.name);
      html += `<div class="checkline"><input type="checkbox" ${checked?'checked':''} onchange="toggleShareName(${jsArg(p.name)})"> ${renderParticipantAvatar(p)} <span>${esc(p.name)}</span></div>`;
    });
  }
  html += `<div class="row" style="margin-top:12px">
      <button class="btn-sm" onclick="cancelAdd()">取消</button>
      <button class="btn-main" id="expenseSaveButton" style="flex:1;margin-left:8px" ${expenseSaving?'disabled':''} onclick="submitExpense()">${expenseSaving?'儲存中…':(S.editExpenseId?'儲存修改':'儲存花費')}</button>
    </div></lumen-card>`;
  return html;
}
function setPayer(name){ S.newExpense.payer=name; syncFormInputs(); render(); }
function toggleEditShare(){ syncFormInputs(); S.newExpense.editShare=!S.newExpense.editShare; render(); }
function selectAllShare(){ syncFormInputs(); S.newExpense.shareWith=S.meeting.participants.map(p=>p.name); render(); }
function toggleShareName(name){
  syncFormInputs();
  const sw=S.newExpense.shareWith, i=sw.indexOf(name);
  if(i>=0) sw.splice(i,1); else sw.push(name);
  render();
}
function syncFormInputs(){
  const it=document.getElementById('ex_item'); const am=document.getElementById('ex_amount');
  if(it) S.newExpense.item=it.value;
  if(am) S.newExpense.amount=am.value;
}
function cancelAdd(){ S.showAdd=false; S.editExpenseId=null; S.newExpense=null; render(); }
async function deleteExpense(id){
  const e=S.expenses.find(x=>x.id===id); if(!e) return;
  if(!confirm('刪除「'+e.item+'」（'+fmt(e.amount)+'）？此操作無法自動還原。')) return;
  try{
    await window.fb.deleteDoc(window.fb.doc(db,'meetings',meetingId(),'expenses',id));
    if(S.editExpenseId===id) cancelAdd();
  }catch(err){ alert('刪除花費失敗，請檢查網絡後再試。'); }
}
async function submitExpense(){
  if(expenseSaving) return;
  syncFormInputs();
  const ne=S.newExpense, amt=cents(ne.amount), editId=S.editExpenseId;
  if(!ne.item.trim()){ alert('請輸入項目名稱'); return; }
  if(amt<=0){ alert('金額需大於 0'); return; }
  if(!ne.payer){ alert('請選擇實際付款人'); return; }
  if(ne.shareWith.length===0){ alert('分攤對象至少需 1 人'); return; }
  const expense={item:ne.item.trim(),amount:amt,payer:ne.payer,shareWith:[...ne.shareWith]};
  expenseSaving=true;
  const saveButton=document.getElementById('expenseSaveButton');
  if(saveButton){saveButton.disabled=true;saveButton.textContent='儲存中…';}
  try{
    if(editId){
      await window.fb.updateDoc(window.fb.doc(db,'meetings',meetingId(),'expenses',editId),expense);
    }else{
      await window.fb.setDoc(window.fb.doc(db,'meetings',meetingId(),'expenses',ne.pendingId),{
        ...expense,addedBy:'共同編輯者',createdAt:ne.pendingCreatedAt
      });
    }
    S.showAdd=false; S.editExpenseId=null; S.newExpense=null; render();
  }catch(err){
    console.error('儲存花費失敗',err);
    alert('儲存花費失敗（'+(err.code||'未知原因')+'），請檢查網絡後再試。');
  }finally{
    expenseSaving=false;
    const currentButton=document.getElementById('expenseSaveButton');
    if(currentButton){
      currentButton.disabled=false;
      currentButton.textContent=S.editExpenseId?'儲存修改':'儲存花費';
    }
  }
}
function renderTransferBadge(status){
  const paid=status==='paid';
  return '<lumen-badge class="transfer-status-badge" variant="'+(paid?'success':'warning')+'">'+(paid?'已付款':'待付款')+'</lumen-badge>';
}
function renderTransferGroup(kind,pendingItems,doneItems,transit,archived){
  const incoming=kind==='receive', noun=incoming?'收款':'付款';
  const amount=pendingItems.reduce((sum,t)=>sum+t.amount,0);
  let html=`<section class="transfer-group ${kind}"><div class="row transfer-heading"><b>中轉人${noun}</b><span class="transfer-total">待${incoming?'收':'付'} ${fmt(amount)}</span></div>`;
  if(pendingItems.length){
    html+=`<div class="transfer-subtitle">待${noun}（${pendingItems.length}筆）</div>`;
    pendingItems.forEach(t=>{
      const busy=markingTransferKeys.has(transferKey(t.from,t.to,t.amount));
      html+=`<div class="row transfer-row"><span class="transfer-flow">${renderTransferBadge('pending')}<span class="transfer-description">${esc(t.from)} → ${esc(t.to)}：<b>${fmt(t.amount)}</b></span></span>${archived?'':`<button class="btn-sm" ${busy?'disabled':''} onclick="markPaid(${jsArg(t.from)},${jsArg(t.to)},${t.amount})">${busy?'記錄中…':'標記已付款'}</button>`}</div>`;
    });
  }else{
    html+=`<p class="small">目前沒有待${noun}</p>`;
  }
  if(doneItems.length){
    html+=`<div class="transfer-subtitle">已完成（${doneItems.length}筆）</div>`;
    doneItems.forEach(t=>{
      html+=`<div class="row transfer-row"><span class="transfer-flow">${renderTransferBadge('paid')}<span class="transfer-description">${esc(t.from)} → ${esc(t.to)}：<b>${fmt(t.amount)}</b></span></span>${archived?'':`<button class="btn-sm" onclick="unmarkPaid(${jsArg(t.id)})">取消</button>`}</div>`;
    });
  }
  return html+'</section>';
}
function renderOtherCompleted(transfers,archived){
  if(!transfers.length) return '';
  let html=`<section class="transfer-group"><div class="row transfer-heading"><b>其他已完成轉帳</b><span class="small">${transfers.length}筆</span></div>`;
  transfers.forEach(t=>{
    html+=`<div class="row transfer-row"><span class="transfer-flow">${renderTransferBadge('paid')}<span class="transfer-description">${esc(t.from)} → ${esc(t.to)}：<b>${fmt(t.amount)}</b></span></span>${archived?'':`<button class="btn-sm" onclick="unmarkPaid(${jsArg(t.id)})">取消</button>`}</div>`;
  });
  return html+'</section>';
}
function renderSettle(m){
  const {names,paid,owed,net,transit:calculatedTransit} = computeBalances(m, S.expenses);
  if(names.length===0) return '<div class="surface empty-state"><span class="empty-icon" aria-hidden="true">＋</span><strong>先新增參加者</strong><p>到「帳目」加入聚會成員，之後便會自動計算每人的分攤。</p></div>';
  const transit = m.transitId && names.includes(m.transitId) ? m.transitId : calculatedTransit;
  const rnet = remainingNet(net, S.transfers);
  const pending = pendingTransfers(names, transit, rnet);
  const incoming=pending.filter(t=>t.to===transit);
  const outgoing=pending.filter(t=>t.from===transit);
  const completedIncoming=S.transfers.filter(t=>t.to===transit).sort((a,b)=>(a.completedAt||0)-(b.completedAt||0));
  const completedOutgoing=S.transfers.filter(t=>t.from===transit).sort((a,b)=>(a.completedAt||0)-(b.completedAt||0));
  const completedOther=S.transfers.filter(t=>t.from!==transit&&t.to!==transit).sort((a,b)=>(a.completedAt||0)-(b.completedAt||0));
  let summaryHtml='<section class="settle-section"><div class="section-heading"><div><span class="section-kicker">BALANCE SUMMARY</span><h2>每人應付款</h2><p>按各筆花費的分攤對象計算，已包含個別分攤設定。</p></div></div><div class="balance-grid">';
  names.forEach(n=>{
    const v=Math.round(rnet[n]);
    const tone=v>0?'positive':(v<0?'negative':'neutral');
    const status=v>0?'應收款':(v<0?'待付款':'已結清');
    const avatar=renderParticipantAvatar((m.participants||[]).find(p=>p.name===n));
    summaryHtml+='<lumen-card variant="glass" glass="subtle" class="balance-card" role="article" aria-label="'+esc(n)+' 的結算"><div class="balance-card-top">'+avatar+'<span class="balance-name">'+esc(n)+'</span></div><div class="balance-net '+tone+'"><span>'+status+'</span><b>'+(v!==0?fmt(Math.abs(v)):'—')+'</b></div><div class="balance-paid"><span>已代墊</span><b>'+fmt(paid[n]||0)+'</b></div><div class="balance-due"><span>應付分攤</span><strong>'+fmt(owed[n]||0)+'</strong></div></lumen-card>';
  });
  summaryHtml+='</div></section>';
  let html='<section class="settle-section"><div class="section-heading"><div><span class="section-kicker">TRANSFER PLAN</span><h2>中轉人結算</h2><p>中轉人集中收款與付款，其他人只需按安排轉帳。</p></div></div>';
  html+='<lumen-card variant="glass" glass="strong" class="transfer-control"><div class="transit-current"><div class="transit-person"><span class="transit-person-icon" aria-hidden="true">⇄</span><div class="transit-person-copy"><span class="small">目前中轉人</span><strong>'+esc(transit)+'</strong></div></div>';
  if(!m.archived){
    const toggleLabel=S.showTransitPicker?'收起名單':'更換中轉人';
    html+='<button type="button" class="btn-sm transit-change" aria-expanded="'+(S.showTransitPicker?'true':'false')+'" '+(S.showTransitPicker?'aria-controls="transitPicker"':'')+' onclick="toggleTransitPicker()"><span>'+toggleLabel+'</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4 4.5-4"/></svg></button>';
  }
  html+='</div>';
  if(S.showTransitPicker&&!m.archived){
    const choices=names.filter(n=>n!==transit);
    html+='<div class="transit-picker" id="transitPicker"><p class="small">選擇另一位參加者作為中轉人。</p><div class="transit-options">';
    if(!choices.length) html+='<span class="small">目前沒有其他參加者可選。</span>';
    m.participants.filter(p=>p.name!==transit).forEach(p=>{
      const n=p.name;
      html+='<button type="button" class="transit-option" onclick="setTransit('+jsArg(n)+')">'+renderParticipantAvatar(p)+'<span class="transit-option-name">'+esc(n)+'</span><span class="transit-option-action">選擇</span></button>';
    });
    html+='</div></div>';
  }
  html+='</lumen-card>';
  if(pending.length===0&&S.transfers.length===0){
    html+='<div class="settled-note"><span class="empty-icon" aria-hidden="true">✓</span><span>目前無需轉帳，所有帳目已平衡。</span></div>';
  }else{
    html+='<div class="transfer-columns">'+renderTransferGroup('receive',incoming,completedIncoming,transit,m.archived)+renderTransferGroup('pay',outgoing,completedOutgoing,transit,m.archived)+'</div>';
    html+=renderOtherCompleted(completedOther,m.archived);
  }
  html+='</section>';
  html+=summaryHtml;
  return html;
}
function toggleTransitPicker(){
  if(S.meeting?.archived) return;
  S.showTransitPicker=!S.showTransitPicker;
  render();
}
async function setTransit(name){
  if(S.meeting?.archived) return;
  try{
    await window.fb.updateDoc(window.fb.doc(db,'meetings',meetingId()), {transitId:name});
    S.showTransitPicker=false;
    render();
  }catch(err){
    alert('更改中轉人失敗，請檢查網絡後再試。');
  }
}
async function markPaid(from,to,amount){
  const id=meetingId(), key=transferKey(from,to,amount);
  if(markingTransferKeys.has(key)) return;
  markingTransferKeys.add(key);
  render();
  try{
    const transferId=await paidTransferId(from,to,amount);
    await window.fb.setDoc(window.fb.doc(db,'meetings',id,'transfers',transferId),{
      from,to,amount,completedBy:'共同編輯者',completedAt:Date.now()
    });
  }catch(err){
    console.error('標記付款失敗',err);
    alert('標記已付款失敗，請檢查網絡後再試。');
  }finally{
    markingTransferKeys.delete(key);
    if(meetingId()===id&&S.view==='settle') render();
  }
}
async function unmarkPaid(tid){
  await window.fb.deleteDoc(window.fb.doc(db,'meetings',meetingId(),'transfers',tid));
}

window.addEventListener('hashchange', boot);
boot();
</script>
