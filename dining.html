<script type="module">
import { defineLumenCard } from "https://esm.sh/@santi020k/lumen-elements@3.0.0/components/card?bundle";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, collection, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, orderBy, runTransaction, getDocsFromServer, writeBatch, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
defineLumenCard();

const firebaseConfig={
  apiKey:"AIzaSyBpW-txlA_f0u9SH2N6Usp8AuO-p11yyGE",
  authDomain:"split-bill-easy.firebaseapp.com",
  projectId:"split-bill-easy",
  storageBucket:"split-bill-easy.firebasestorage.app",
  messagingSenderId:"926268274788",
  appId:"1:926268274788:web:5b0a933db3dc6ff8ee8771"
};
const db=getFirestore(initializeApp(firebaseConfig));
const STORAGE_KEY='split-bill-dining-participants-v1';
const DEFAULT_PARTICIPANTS=['A','B','C','D'];
const appEl=document.getElementById('app');
let state={session:null,items:[],selected:new Set(),editItemId:null,itemDraft:'',bulkAction:false,showPeopleManage:false,creatingSession:false,unsub:[],qrData:''};
let qrPromise=null;

function diningId(){const m=location.hash.match(/#\/d\/([^\/?#]+)/);return m?decodeURIComponent(m[1]):null;}
function fmt(cents){const negative=cents<0;const n=Math.abs(Number(cents)||0);return (negative?'−':'')+'HK$'+(n/100).toFixed(2);}
function amountText(cents){return (Number(cents||0)/100).toFixed(2);}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsArg(value){return JSON.stringify(String(value)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uniqueNames(values){
  const seen=new Set(),out=[];
  (Array.isArray(values)?values:[]).forEach(function(value){
    const name=String(value==null?'':value).trim();
    const key=name.toLocaleLowerCase();
    if(name&&name.length<=30&&!seen.has(key)){seen.add(key);out.push(name);}
  });
  return out;
}
function loadSavedParticipants(){
  try{return uniqueNames(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));}catch(error){return [];}
}
function setStatus(message){
  const el=document.getElementById('status');
  if(el)el.textContent=message||'';
}
function mergeParticipantNames(currentValues,addedValues){
  const next=uniqueNames(currentValues);
  const replaced=[],unadded=[];
  uniqueNames(addedValues).forEach(function(name){
    if(next.some(function(existing){return existing.toLocaleLowerCase()===name.toLocaleLowerCase();}))return;
    const defaultIndex=next.findIndex(function(existing){return DEFAULT_PARTICIPANTS.includes(existing);});
    if(defaultIndex>=0){replaced.push({from:next[defaultIndex],to:name});next[defaultIndex]=name;}
    else if(next.length<100)next.push(name);
    else unadded.push(name);
  });
  return {participants:next,replaced:replaced,unadded:unadded};
}
function modeHeader(){
  return '<div class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 18h17M5 18a7 7 0 0 1 14 0M8.5 9h7M10.5 5.5h3"/></svg></span><span>埋單有數<small>餐飲分單模式</small></span></div><a class="back-link" href="./index.html">← 選擇其他模式</a></div>';
}
function showLoading(){appEl.innerHTML='<main class="shell">'+modeHeader()+'<lumen-card variant="glass" glass="strong" class="card"><p class="helper">正在載入餐單…</p></lumen-card></main>';}

// Parse only arithmetic; keep exact fractions until the final rounding to cents.
function expressionHundredths(value,max,percent){
  const raw=String(value==null?'':value).trim();if(!raw)return {empty:true};
  if(raw.length>256)return {error:'算式過長，請縮短至256個字元內。'};
  const source=raw.replace(/[xX×]/g,'*');let pos=0;
  const rangeError=percent?'百分比須介乎0至100%。':'金額須介乎 HK$0.00 至 HK$1,000,000.00。';
  function skip(){while(/\s/.test(source[pos]||'')&&pos<source.length)pos++;}
  function fail(message){throw new Error(message||'算式未完成或格式不正確，請使用數字及 +、-、x、*、/。');}
  function primary(){
    skip();const sign=source[pos];
    if(sign==='+'||sign==='-'){pos++;const v=primary();return {n:sign==='-'?-v.n:v.n,d:v.d};}
    if(sign==='('){pos++;const v=sum();skip();if(source[pos]!==')')fail('括號未配對。');pos++;return v;}
    const match=/^(?:\d+(?:\.\d*)?|\.\d+)/.exec(source.slice(pos));
    if(!match)fail();pos+=match[0].length;
    const parts=match[0].split('.'),fraction=parts[1]||'';
    return {n:BigInt((parts[0]||'0')+fraction),d:10n**BigInt(fraction.length)};
  }
  function product(){
    let left=primary();
    while(true){
      skip();const op=source[pos];if(op!=='*'&&op!=='/')return left;
      pos++;const right=primary();
      if(op==='/'&&right.n===0n)fail('除數不可為0。');
      left=op==='*'?{n:left.n*right.n,d:left.d*right.d}:{n:left.n*right.d,d:left.d*right.n};
      if(left.d<0n){left.n=-left.n;left.d=-left.d;}
    }
  }
  function sum(){
    let left=product();
    while(true){
      skip();const op=source[pos];if(op!=='+'&&op!=='-')return left;
      pos++;const right=product();
      left={n:left.n*right.d+(op==='+'?right.n:-right.n)*left.d,d:left.d*right.d};
    }
  }
  try{
    const result=sum();skip();if(pos!==source.length)fail();
    if(result.n<0n||result.n*100n>BigInt(max)*result.d)return {error:rangeError};
    return {hundredths:Number((result.n*200n+result.d)/(result.d*2n))};
  }catch(error){return {error:error.message};}
}
function moneyCents(value){
  const parsed=expressionHundredths(value,100000000,false);
  return parsed.error||parsed.empty?parsed:{cents:parsed.hundredths};
}
function percentBps(value){
  const parsed=expressionHundredths(value,10000,true);
  return parsed.error||parsed.empty?parsed:{basisPoints:parsed.hundredths};
}
function previewAmount(input,kind){
  if(kind==='item')state.itemDraft=input.value;
  const target=document.getElementById(kind+'Calculation');if(!target)return;
  const percent=kind!=='item'&&document.getElementById(kind+'Mode').value==='percent';
  const parsed=percent?percentBps(input.value):moneyCents(input.value);
  const error=parsed.error||(kind==='item'&&!parsed.empty&&parsed.cents<=0?'餐點金額須大於 HK$0.00。':'');
  input.setAttribute('aria-invalid',error?'true':'false');
  target.textContent=error||(parsed.empty?'可輸入算式，例如 38+42、58x2、120/3（先乘除後加減）。':'計算結果：'+(percent?(parsed.basisPoints/100).toFixed(2)+'%':fmt(parsed.cents))+'（四捨五入至兩位小數）');
  target.style.color=error?'#a84956':'';
}
function allocate(total,weights){
  const names=Object.keys(weights).filter(function(name){return Number(weights[name])>0;});
  const out=Object.create(null);Object.keys(weights).forEach(function(name){out[name]=0;});
  const weightTotal=names.reduce(function(sum,name){return sum+Number(weights[name]);},0);
  if(!names.length||!total||weightTotal<=0)return out;
  const denom=BigInt(weightTotal),sum=BigInt(total);
  const rows=names.map(function(name,index){const product=sum*BigInt(weights[name]);return{name:name,index:index,cents:Number(product/denom),remainder:product%denom};});
  let rest=total-rows.reduce(function(acc,row){return acc+row.cents;},0);
  rows.sort(function(a,b){if(a.remainder===b.remainder)return a.index-b.index;return a.remainder>b.remainder?-1:1;});
  for(let i=0;i<rest&&i<rows.length;i++)rows[i].cents++;
  rows.forEach(function(row){out[row.name]=row.cents;});return out;
}
function readAdjustment(mode,value,subtotal){
  if(mode==='percent')return {cents:Number((BigInt(subtotal)*BigInt(value||0)+5000n)/10000n)};
  return {cents:Number(value||0)};
}
function calculate(){
  const session=state.session,people=(session&&Array.isArray(session.participants)?session.participants:[]);
  const base=Object.create(null);people.forEach(function(name){base[name]=0;});
  state.items.forEach(function(item){
    const recipients=uniqueNames(item.responsible).filter(function(name){return Object.prototype.hasOwnProperty.call(base,name);});
    const weights=Object.create(null);recipients.forEach(function(name){weights[name]=1;});
    const parts=allocate(Number(item.amount)||0,weights);recipients.forEach(function(name){base[name]+=parts[name]||0;});
  });
  const subtotal=Object.keys(base).reduce(function(sum,name){return sum+base[name];},0);
  const serviceResult=readAdjustment(session&&session.serviceMode,session&&session.serviceValue,subtotal);
  const discountResult=readAdjustment(session&&session.discountMode,session&&session.discountValue,subtotal);
  const errors=[];
  if(discountResult.cents>subtotal)errors.push('折扣不可多於餐點小計。');
  const service=allocate(serviceResult.cents,base);
  const discount=allocate(discountResult.cents,base);
  const due=Object.create(null);people.forEach(function(name){due[name]=(base[name]||0)+(service[name]||0)-(discount[name]||0);});
  return{base:base,subtotal:subtotal,serviceTotal:serviceResult.cents,discountTotal:discountResult.cents,service:service,discount:discount,due:due,total:subtotal+serviceResult.cents-discountResult.cents,errors:errors};
}

function renderPeopleManage(people){
  if(!people.length)return '<div class="people-manage"><p class="helper">目前沒有參加者。</p></div>';
  return '<div class="people-manage">'+people.map(function(name){return '<div class="people-manage-row"><span>'+avatar(name)+esc(name)+'</span><button type="button" class="tiny-btn" onclick="removeParticipant('+jsArg(name)+')">移除</button></div>';}).join('')+'</div>';
}
function renderAssignees(people){
  if(!people.length)return '<span class="helper">先加入參加者。</span>';
  return people.map(function(name){return '<label class="assign-choice"><input type="checkbox" value="'+esc(name)+'" '+(state.selected.has(name)?'checked':'')+' onchange="toggleAssignee(this)" '+(state.session&&state.session.archived?'disabled':'')+'><span>'+avatar(name)+esc(name)+'</span></label>';}).join('');
}

    return '<div class="item-row"><div class="item-main"><div class="item-name-line"><span class="item-name">餐點 '+(index+1)+'</span><span class="item-price">'+fmt(item.amount)+'</span></div><div class="item-share-note">'+(names.length?esc(names.join('、'))+(names.length>1?' · 平均分攤':' · 個人負責'):'未指定負責人')+'</div></div>'+

    '<select id="'+kind+'Mode" aria-label="'+title+'輸入方式" onchange="saveAdjustment(\''+kind+'\')" '+(disabled?'disabled':'')+'><option value="percent" '+(mode==='percent'?'selected':'')+'>百分比</option><option value="amount" '+(mode==='amount'?'selected':'')+'>實際金額</option></select></div>'+

function renderError(message){appEl.innerHTML='<main class="shell">'+modeHeader()+'<lumen-card variant="glass" glass="strong" class="card"><div class="warning">'+esc(message)+'</div></lumen-card></main>';}
async function createDirectSession(){
  if(state.creatingSession)return;
  state.creatingSession=true;showLoading();
  try{
    const ref=doc(collection(db,'diningSessions'));
    await setDoc(ref,{name:'餐飲分單',participants:DEFAULT_PARTICIPANTS,payer:'A',serviceMode:'percent',serviceValue:0,discountMode:'percent',discountValue:0,archived:false,createdAt:Date.now()});
    history.replaceState(null,'',location.pathname+location.search+'#/d/'+encodeURIComponent(ref.id));
    await boot();
  }catch(error){
    console.error('開啟餐飲分單失敗',error);
    renderError(error&&error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單，請先更新資料庫 Rules。':'無法開啟餐飲分單，請檢查網絡後再試。');
  }finally{state.creatingSession=false;}
}
async function boot(){
  clearSubscriptions();state.session=null;state.items=[];state.selected=new Set();state.editItemId=null;state.itemDraft='';state.showPeopleManage=false;
  const id=diningId();if(!id){await createDirectSession();return;}
  showLoading();const sessionRef=doc(db,'diningSessions',id);
  state.unsub.push(onSnapshot(sessionRef,function(snapshot){
    if(!snapshot.exists()){state.session=false;renderError('找不到這張餐單，請檢查分享連結。');return;}
    state.session=Object.assign({id:id},snapshot.data());
    if(!Array.isArray(state.session.participants))state.session.participants=[];
    renderActive();
  },function(error){console.error(error);renderError(error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單資料，請先更新資料庫 Rules。':'載入餐單失敗，請檢查網絡後再試。');}));
  const itemsQuery=query(collection(db,'diningSessions',id,'items'),orderBy('createdAt','asc'));
  state.unsub.push(onSnapshot(itemsQuery,function(snapshot){
    state.items=snapshot.docs.map(function(row){return Object.assign({id:row.id},row.data());}).sort(function(a,b){return Number(a.createdAt||0)-Number(b.createdAt||0)||String(a.id).localeCompare(String(b.id));});
    if(state.session)renderActive();
  },function(error){console.error(error);renderError(error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單餐點資料，請先更新資料庫 Rules。':'載入餐點失敗，請檢查網絡後再試。');}));
}
function clearSubscriptions(){state.unsub.forEach(function(unsub){unsub();});state.unsub=[];}
function toggleAssignee(input){if(input.checked)state.selected.add(input.value);else state.selected.delete(input.value);}
function selectAllAssignees(){state.selected=new Set(state.session.participants||[]);renderActive();}
function clearAssignees(){state.selected.clear();renderActive();}
function clearAmountInput(){
  const input=document.getElementById('itemAmount');state.itemDraft='';
  if(input){input.value='';previewAmount(input,'item');input.focus();}
}
async function clearDiningAmounts(){
  if(!state.session||state.session.archived||state.bulkAction)return;
  if(!confirm('確定清空這張餐單的所有餐點金額，並將服務費及折扣歸零？參加者名單會保留。此操作不能復原。'))return;
  const id=diningId();state.bulkAction=true;renderActive();setStatus('正在清空金額…');
  try{
    const snapshot=await getDocsFromServer(collection(db,'diningSessions',id,'items'));
    // Keep each batch below Firestore's write limit, including the final session update.
    for(let offset=0;offset<snapshot.docs.length;offset+=450){
      const batch=writeBatch(db);
      snapshot.docs.slice(offset,offset+450).forEach(function(row){batch.delete(row.ref);});
      if(offset+450>=snapshot.docs.length)batch.update(doc(db,'diningSessions',id),{serviceValue:0,discountValue:0});
      await batch.commit();
    }
    if(!snapshot.docs.length)await updateDoc(doc(db,'diningSessions',id),{serviceValue:0,discountValue:0});
    if(diningId()===id){state.itemDraft='';state.editItemId=null;}
  }catch(error){showWriteError('清空金額未能全部完成，請重新檢查餐單後再試',error);}
  finally{state.bulkAction=false;if(diningId()===id)renderActive();}
}
async function clearAllParticipants(){
  if(!state.session||state.session.archived||state.bulkAction||!state.session.participants.length)return;
  if(state.items.length){alert('請先按「清空金額」移除所有餐點，再清空參加者，以免留下無人分攤的餐點。');return;}
  if(!confirm('確定清空這張餐單的所有參加者？已儲存的本機名單會保留。此操作不能復原。'))return;
  const id=diningId();state.bulkAction=true;renderActive();
  try{
    const items=await getDocsFromServer(query(collection(db,'diningSessions',id,'items'),limit(1)));
    if(!items.empty){alert('餐單中仍有餐點，請先按「清空金額」再清空參加者。');return;}
    await updateDoc(doc(db,'diningSessions',id),{participants:[],payer:null});
    if(diningId()===id)state.selected.clear();
  }catch(error){showWriteError('清空參加者失敗',error);}
  finally{state.bulkAction=false;if(diningId()===id)renderActive();}
}
async function addParticipant(event){
  event.preventDefault();const input=document.getElementById('newParticipant'),name=(input.value||'').trim();
  if(!name){input.focus();return;}if(name.length>30){alert('參加者名稱不可超過30個字。');return;}
  let committedParticipants=null,replacement=null;
  try{
    await runTransaction(db,async function(tx){
      const ref=doc(db,'diningSessions',diningId()),snap=await tx.get(ref);
      if(!snap.exists())throw new Error('missing');
      const current=uniqueNames(snap.data().participants);
      if(current.some(function(row){return row.toLocaleLowerCase()===name.toLocaleLowerCase();}))throw new Error('duplicate');
      const merged=mergeParticipantNames(current,[name]);
      replacement=merged.replaced[0]||null;
      if(replacement&&state.items.some(function(item){return (item.responsible||[]).includes(replacement.from);}))throw new Error('default-in-use');
      if(!replacement&&current.length>=100)throw new Error('max');
      committedParticipants=merged.participants;
      const payer=replacement&&snap.data().payer===replacement.from?name:(snap.data().payer||name);
      tx.update(ref,{participants:committedParticipants,payer:payer});
    });
  }catch(error){if(error.message==='duplicate')alert('這個名字已存在。');else if(error.message==='max')alert('參加者最多100人。');else if(error.message==='default-in-use')alert('預設人員「'+(replacement&&replacement.from||'')+'」已有負責的餐點，請先移除或修改相關餐點，再新增姓名取代。');else showWriteError('新增參加者失敗',error);return;}
  if(replacement)state.selected.delete(replacement.from);
  state.selected.add(name);
  if(state.session&&committedParticipants)state.session.participants=committedParticipants;
  renderActive();
}
async function removeParticipant(name){
  if(state.items.some(function(item){return (item.responsible||[]).includes(name);})) {alert('這位參加者已有負責的餐點，請先移除或更改相關餐點分攤。');return;}
  const people=state.session.participants||[];
  if(people.length<=1){alert('餐單至少需要保留一位參加者。');return;}
  if(!confirm('確定移除參加者「'+name+'」？'))return;
  const next=people.filter(function(row){return row!==name;});
  const payer=state.session.payer===name?(next[0]||null):state.session.payer;
  try{await updateDoc(doc(db,'diningSessions',diningId()),{participants:next,payer:payer});}
  catch(error){showWriteError('移除參加者失敗',error);}
}
function togglePeopleManage(){state.showPeopleManage=!state.showPeopleManage;renderActive();}
async function saveCurrentRoster(){
  const people=uniqueNames(state.session&&state.session.participants);
  if(!people.length){setStatus('目前沒有參加者可儲存。');return;}
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(people));setStatus('已儲存 '+people.length+' 位參加者至此瀏覽器。');}
  catch(error){setStatus('無法在此瀏覽器儲存名單。');}
}
async function loadRosterIntoSession(){
  const saved=loadSavedParticipants();if(!saved.length){setStatus('此瀏覽器尚未儲存參加者名單。');return;}
  let committedParticipants=null,replacedNames=[];
  try{
    await runTransaction(db,async function(tx){
      const ref=doc(db,'diningSessions',diningId()),snap=await tx.get(ref);
      if(!snap.exists())throw new Error('missing');
      const current=uniqueNames(snap.data().participants),merged=mergeParticipantNames(current,saved);
      replacedNames=merged.replaced;
      const inUse=replacedNames.find(function(row){return state.items.some(function(item){return (item.responsible||[]).includes(row.from);});});
      if(inUse)throw new Error('default-in-use:'+inUse.from);
      if(merged.unadded.length)throw new Error('max');
      committedParticipants=merged.participants;
      const oldPayer=snap.data().payer;
      const payerReplacement=replacedNames.find(function(row){return row.from===oldPayer;});
      const payer=payerReplacement?payerReplacement.to:oldPayer;
      tx.update(ref,{participants:committedParticipants,payer:payer||committedParticipants[0]||null});
    });
    if(state.session&&committedParticipants)state.session.participants=committedParticipants;
    replacedNames.forEach(function(row){if(state.selected.has(row.from)){state.selected.delete(row.from);state.selected.add(row.to);}});
    renderActive();setStatus('已依序取代預設人員，並加入本機名單。');
  }catch(error){if(error.message==='max')setStatus('載入後人數會超過100人。');else if(error.message.startsWith('default-in-use:'))alert('預設人員「'+error.message.split(':')[1]+'」已有負責的餐點，請先移除或修改相關餐點，再載入名單。');else showWriteError('載入名單失敗',error);}
}
async function saveAdjustment(kind){
  const modeEl=document.getElementById(kind+'Mode'),valueEl=document.getElementById(kind+'Value');
  if(!modeEl||!valueEl)return;
  const mode=modeEl.value,parsed=mode==='percent'?percentBps(valueEl.value):moneyCents(valueEl.value);
  if(parsed.error||parsed.empty){alert(parsed.error||'請輸入數值。');previewAmount(valueEl,kind);valueEl.focus();return;}
  const value=mode==='percent'?parsed.basisPoints:parsed.cents;
  if(kind==='discount'&&mode==='amount'&&value>calculate().subtotal){alert('折扣不可多於餐點小計。');renderActive();return;}
  try{await updateDoc(doc(db,'diningSessions',diningId()),{[kind+'Mode']:mode,[kind+'Value']:value});}
  catch(error){showWriteError('儲存設定失敗',error);}
}
async function saveItem(event){
  event.preventDefault();
  const input=document.getElementById('itemAmount'),parsed=moneyCents(input.value);
  const people=(state.session.participants||[]).filter(function(name){return state.selected.has(name);});
  if(parsed.error||parsed.empty||parsed.cents<=0){alert(parsed.error||'請輸入大於 HK$0.00 的金額。');return;}
  if(!people.length){alert('請至少選一位負責人；共享餐點可選多位或按「全選」。');return;}
  const data={amount:parsed.cents,responsible:people};
  try{
    if(state.editItemId){
      const existing=state.items.find(function(item){return item.id===state.editItemId;});
      data.createdAt=Number(existing&&existing.createdAt)||Date.now();
      await updateDoc(doc(db,'diningSessions',diningId(),'items',state.editItemId),data);
    }else{data.createdAt=Date.now();await addDoc(collection(db,'diningSessions',diningId(),'items'),data);}
    state.editItemId=null;state.itemDraft='';state.selected=new Set();renderActive();
  }catch(error){showWriteError('儲存餐點失敗',error);}
}
function editItem(id){
  const item=state.items.find(function(row){return row.id===id;});if(!item)return;
  state.itemDraft=amountText(item.amount);state.editItemId=id;state.selected=new Set(item.responsible||[]);renderActive();
  const amount=document.getElementById('itemAmount');if(amount)amount.focus();
}
function cancelItemEdit(){state.editItemId=null;state.itemDraft='';state.selected=new Set();renderActive();}
async function removeItem(id){
  if(!confirm('確定移除這項餐點？'))return;
  try{await deleteDoc(doc(db,'diningSessions',diningId(),'items',id));}
  catch(error){showWriteError('移除餐點失敗',error);}
}
function copyLink(){
  const link=window.location.href;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(link).then(function(){setStatus('已複製餐單連結。');}).catch(function(){window.prompt('請手動複製餐單連結：',link);});}
  else window.prompt('請手動複製餐單連結：',link);
}
async function openQr(){
  const dialog=document.getElementById('qrDialog'),img=document.getElementById('qrImage'),loading=document.getElementById('qrLoading'),error=document.getElementById('qrError');
  dialog.showModal();error.hidden=true;
  try{
    if(!qrPromise)qrPromise=import('https://esm.sh/qrcode@1.5.4?bundle');
    const mod=await qrPromise,make=mod.toString||mod.default&&mod.default.toString;
    const svg=await make(window.location.href,{type:'svg',errorCorrectionLevel:'M',margin:2,width:240,color:{dark:'#202747',light:'#ffffff'}});
    state.qrData='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.src=state.qrData;img.hidden=false;loading.hidden=true;
  }catch(err){console.error(err);loading.hidden=true;error.textContent='QR Code 暫時無法載入，請使用複製連結。';error.hidden=false;}
}
function closeQr(){const dialog=document.getElementById('qrDialog');if(dialog.open)dialog.close();}
function copyDiningLink(){copyLink();closeQr();}
function showWriteError(action,error){
  console.error(action,error);
  if(error&&error.code==='permission-denied'){alert(action+'：Firestore Rules 尚未開放餐飲分單資料，請更新 Rules 後再試。');return;}
  alert(action+'，請檢查網絡後再試。');
}
Object.assign(window,{clearAmountInput,clearDiningAmounts,clearAllParticipants,previewAmount,addParticipant,removeParticipant,togglePeopleManage,saveCurrentRoster,loadRosterIntoSession,saveAdjustment,selectAllAssignees,clearAssignees,toggleAssignee,saveItem,cancelItemEdit,editItem,removeItem,copyLink,openQr,closeQr,copyDiningLink});
window.addEventListener('hashchange',boot);
boot();
