<style>

*{box-sizing:border-box}
html{min-height:100%;scroll-padding-top:24px;background:hsl(var(--canvas))}
body{margin:0;min-height:100vh;font-family:var(--ui-font);font-size:16px;line-height:1.5;color:hsl(var(--ink));font-variant-numeric:tabular-nums;background:hsl(var(--canvas))}
button,input,select{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid hsl(var(--brand)/.5);outline-offset:3px}
lumen-card{display:block}
h1,h2,h3,p{margin:0}
.shell{width:min(1168px,100%);margin:auto;padding:24px 32px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}

.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:hsl(var(--brand));color:hsl(var(--on-brand))}
.brand-mark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.topbar h1{font-size:22px;letter-spacing:-.035em;font-weight:780;white-space:nowrap}

.action-btn,.secondary-btn,.tiny-btn,.text-btn,.primary-btn,.remove-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 12px;border:1px solid hsl(var(--line));border-radius:8px;background:hsl(var(--surface));color:hsl(var(--ink-soft));font-size:13px;font-weight:700;text-decoration:none;line-height:1.4}
.action-btn:hover,.secondary-btn:hover,.tiny-btn:hover{border-color:hsl(var(--brand)/.45);background:hsl(var(--brand-soft));color:hsl(var(--brand))}
.text-btn{padding:6px 8px;border-color:transparent;background:transparent;color:hsl(var(--brand))}
.text-btn:hover{background:hsl(var(--brand-soft))}
.primary-btn{min-height:48px;border-color:transparent;background:hsl(var(--brand));color:hsl(var(--on-brand));font-size:15px}

.danger-btn{color:hsl(var(--danger))}

.card{overflow:visible;min-width:0;padding:24px;border:1px solid hsl(var(--line)/.75);border-radius:16px;background:hsl(var(--surface));box-shadow:0 2px 5px hsl(var(--ink)/.025)}

.entry-heading h2,.receipt-heading h2{flex-shrink:0;white-space:nowrap}
h2{font-size:17px;font-weight:750;letter-spacing:-.02em}
.editing-tag,.count-pill{font-size:12px;font-weight:650;color:hsl(var(--ink-muted));white-space:nowrap}
label{display:block;font-size:13px;font-weight:650;color:hsl(var(--ink-soft))}
input[type=text],select{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid hsl(var(--line));border-radius:8px;background:hsl(var(--surface));color:hsl(var(--ink));font-size:15px}

.adjustments{grid-area:adjust;min-width:0;border:1px solid hsl(var(--line)/.75);border-radius:12px;background:hsl(var(--surface))}

.adjust-input{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:6px}

.discount-allocation label{font-size:12px}
.discount-allocation select{font-size:13px;padding-inline:8px}
.adjust-feedback{min-height:18px;margin-top:6px}
.history-panel{grid-area:history;min-width:0;padding:8px 0 0}
.section-heading{flex-wrap:wrap;padding:0 4px 8px}
.section-heading h2{font-size:15px}
.item-list{border-top:1px solid hsl(var(--line));border-bottom:1px solid hsl(var(--line))}
.item-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px}
.item-row+.item-row{border-top:1px solid hsl(var(--line)/.6)}
.item-index{align-self:start;padding-top:3px;color:hsl(var(--ink-muted));font-size:12px}
.item-main{min-width:0}
.item-price{font-size:16px;font-weight:720}

.item-actions{display:flex;gap:4px}
.item-actions .text-btn{font-size:12px}
.remove-btn{min-width:40px;width:40px;height:40px;padding:0;border-color:transparent;background:transparent;color:hsl(var(--ink-muted));font-size:20px;font-weight:400}
.remove-btn:hover{background:hsl(var(--danger)/.06);color:hsl(var(--danger))}
.empty-state{padding:24px 8px;color:hsl(var(--ink-muted));font-size:13px;text-align:center}
.receipt{grid-area:receipt;position:sticky;top:24px;padding:28px;background:hsl(var(--surface));border-top:3px solid hsl(var(--brand));scroll-margin-top:20px}
.receipt-heading{margin-bottom:24px}
.receipt-heading h2{font-size:17px}
.receipt-heading span{font-size:12px;color:hsl(var(--ink-muted))}
.receipt-total{padding-bottom:20px;border-bottom:1px solid hsl(var(--line)/.7)}
.receipt-total>span{display:block;color:hsl(var(--ink-muted));font-size:12px}
.receipt-total strong{display:block;margin-top:4px;font-size:clamp(30px,3.3vw,42px);line-height:1.25;letter-spacing:-.04em;font-weight:730;overflow-wrap:anywhere}
.receipt-total strong small{margin-right:5px;font-size:16px;font-weight:550;letter-spacing:0}
.summary-breakdown{display:grid;gap:8px;margin:16px 0 20px}
.breakdown-line{color:hsl(var(--ink-muted));font-size:13px}
.breakdown-line strong{color:hsl(var(--ink-soft));font-weight:550}
.person-totals{border-top:1px dashed hsl(var(--line));padding-top:4px}
.person-total{flex-wrap:wrap;padding:16px 0;row-gap:6px}
.person-total+.person-total{border-top:1px solid hsl(var(--line)/.6)}
.person-total-name{min-width:0;flex:1;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.person-total-number{font-size:21px;font-weight:750;letter-spacing:-.035em;white-space:nowrap}
.person-total-detail{flex-basis:100%;color:hsl(var(--ink-muted));font-size:11px;line-height:1.6;overflow-wrap:anywhere}
.person-total.is-empty .person-total-name,.person-total.is-empty .person-total-number{color:hsl(var(--ink-muted));font-weight:500}
.receipt-note{margin-top:8px;color:hsl(var(--ink-muted));font-size:11px}
.mobile-overview{display:none}
.status{min-height:18px;margin-top:12px;font-size:12px;color:hsl(var(--brand));overflow-wrap:anywhere}
.status:empty{display:none}
.warning{margin:0 0 16px;padding:12px 14px;border:1px solid hsl(var(--warning)/.25);border-radius:8px;background:hsl(var(--warning)/.07);color:hsl(var(--warning));font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.qr-dialog{width:min(400px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;padding:24px;border:1px solid hsl(var(--line));border-radius:16px;background:hsl(var(--surface));color:hsl(var(--ink))}
.qr-dialog::backdrop{background:hsl(var(--ink)/.45)}
.qr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.qr-head h2{margin-bottom:4px}
.qr-frame{display:grid;place-items:center;min-height:260px;margin:16px 0;padding:12px;border:1px solid hsl(var(--line));border-radius:12px;background:hsl(var(--surface))}
.qr-frame img{display:block;width:min(100%,240px);height:auto}
.qr-frame img[hidden]{display:none}
.share-qr-copy{width:100%}
@media(max-width:960px){.shell{padding-inline:24px}.workspace-grid{gap:16px;grid-template-columns:minmax(0,1fr) minmax(290px,.8fr)}.card{padding:20px}.receipt{padding:24px}.adjust-grid{grid-template-columns:1fr}.adjust-box+.adjust-box{padding:16px 0 0;border-left:0;border-top:1px solid hsl(var(--line)/.65)}}
@media(max-width:720px){.shell{max-width:560px;padding:16px 16px 32px}.topbar{gap:8px;margin-bottom:16px}.brand-group{gap:10px}.brand-name{display:none}.brand-divider{display:none}.topbar h1{font-size:20px}.header-actions{gap:6px}.action-btn{min-height:40px;padding-inline:10px;font-size:12px}.workspace-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"entry" "adjust" "receipt" "history";grid-template-rows:auto;gap:12px}.card{padding:20px;border-radius:14px}.receipt{position:static;border-top-width:3px}.mobile-overview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:10px 4px;color:hsl(var(--ink-soft));font-size:13px}.mobile-overview strong{margin-left:6px;color:hsl(var(--ink));font-size:17px}.mobile-overview a{min-height:36px;display:inline-flex;align-items:center;color:hsl(var(--brand));font-weight:650;font-size:12px}.entry-heading{margin-bottom:16px}.amount-entry{min-height:72px}.amount-entry input{font-size:30px}.entry-actions .primary-btn{min-height:48px}.assign-heading{gap:4px}.assign-actions{gap:0}.assign-actions .text-btn{padding-inline:6px}.receipt-total strong{font-size:36px}.receipt-heading{margin-bottom:20px}.adjustments summary{padding:14px 16px;gap:8px}.adjust-summary{font-size:11px}.adjust-grid{padding:16px;gap:16px}.history-panel{padding-top:8px}.item-row{gap:8px;grid-template-columns:24px minmax(0,1fr) auto}.person-total-number{font-size:22px}.brand-mark{width:32px;height:32px}.status{margin-top:8px}}
@media(max-width:360px){.shell{padding-inline:12px}.topbar h1{font-size:18px}.card{padding:16px}.action-btn{padding-inline:8px}.assign-actions .text-btn{font-size:11px;padding-inline:5px}.amount-entry input::placeholder{font-size:17px}.adjustments summary{flex-wrap:wrap}.adjust-summary{flex-basis:calc(100% - 32px);order:3;text-align:left}.chevron{margin-left:auto}.person-total-number{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>

<body>
<div id="app"><p class="helper">載入餐飲分單…</p></div>
<dialog id="qrDialog" class="qr-dialog" aria-labelledby="qrTitle">
  <div class="qr-content">
    <div class="qr-head"><div><h2 id="qrTitle">掃碼加入餐單</h2><p class="helper">掃描後即可查看及共同編輯這張餐單。</p></div><button type="button" class="secondary-btn" onclick="closeQr()" aria-label="關閉 QR Code">✕</button></div>
    <div class="qr-frame"><span id="qrLoading" role="status">正在產生 QR Code…</span><img id="qrImage" alt="餐單分享連結 QR Code" hidden></div>
    <p id="qrError" class="warning" role="alert" hidden></p>
    <button type="button" class="primary-btn share-qr-copy" onclick="copyDiningLink()">複製餐單連結</button>
  </div>
</dialog>
<script type="module">
import { defineLumenCard } from "https://esm.sh/@santi020k/lumen-elements@3.0.0/components/card?bundle";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, collection, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, orderBy, runTransaction, getDocsFromServer, writeBatch, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
defineLumenCard();

const firebaseConfig={
  apiKey:"AIzaSyBpW-txlA_f0u9SH2N6Usp8AuO-p11yyGE",
  authDomain:"split-bill-easy.firebaseapp.com",
  projectId:"split-bill-easy",
  storageBucket:"split-bill-easy.firebasestorage.app",
  messagingSenderId:"926268274788",
  appId:"1:926268274788:web:5b0a933db3dc6ff8ee8771"
};
const db=getFirestore(initializeApp(firebaseConfig));
const STORAGE_KEY='split-bill-dining-participants-v1';
const DEFAULT_PARTICIPANTS=['A','B','C','D'];
const appEl=document.getElementById('app');
let state={session:null,items:[],selected:new Set(),editItemId:null,itemDraft:'',bulkAction:false,showPeopleManage:false,showAdjustments:false,participantDraft:'',statusMessage:'',creatingSession:false,unsub:[],qrData:''};
let qrPromise=null;

function diningId(){const m=location.hash.match(/#\/d\/([^\/?#]+)/);return m?decodeURIComponent(m[1]):null;}
function fmt(cents){const negative=cents<0;const n=Math.abs(Number(cents)||0);return (negative?'−':'')+'HK$'+(n/100).toFixed(2);}
function amountText(cents){return (Number(cents||0)/100).toFixed(2);}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function jsArg(value){return JSON.stringify(String(value)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function uniqueNames(values){
  const seen=new Set(),out=[];
  (Array.isArray(values)?values:[]).forEach(function(value){
    const name=String(value==null?'':value).trim();
    const key=name.toLocaleLowerCase();
    if(name&&name.length<=30&&!seen.has(key)){seen.add(key);out.push(name);}
  });
  return out;
}
function loadSavedParticipants(){
  try{return uniqueNames(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));}catch(error){return [];}
}
function setStatus(message){
  state.statusMessage=message||'';
  const el=document.getElementById('status');
  if(el)el.textContent=state.statusMessage;
}
function mergeParticipantNames(currentValues,addedValues){
  const next=uniqueNames(currentValues);
  const replaced=[],unadded=[];
  uniqueNames(addedValues).forEach(function(name){
    if(next.some(function(existing){return existing.toLocaleLowerCase()===name.toLocaleLowerCase();}))return;
    const defaultIndex=next.findIndex(function(existing){return DEFAULT_PARTICIPANTS.includes(existing);});
    if(defaultIndex>=0){replaced.push({from:next[defaultIndex],to:name});next[defaultIndex]=name;}
    else if(next.length<100)next.push(name);
    else unadded.push(name);
  });
  return {participants:next,replaced:replaced,unadded:unadded};
}
function modeHeader(){
  return '<header class="topbar"><div class="brand-group"><a class="brand" href="./index.html" aria-label="返回埋單有數主頁"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 18h17M5 18a7 7 0 0 1 14 0M8.5 9h7M10.5 5.5h3"/></svg></span><span class="brand-name">埋單有數</span></a><span class="brand-divider" aria-hidden="true"></span><h1>餐飲分單</h1></div>'+
    (state.session?'<nav class="header-actions" aria-label="分享餐單"><button type="button" class="action-btn" onclick="copyLink()">複製連結</button><button type="button" class="action-btn" onclick="openQr()" aria-label="顯示餐單 QR Code">QR Code</button></nav>':'')+'</header>';
}
function showLoading(){appEl.innerHTML='<main class="shell">'+modeHeader()+'<lumen-card variant="glass" glass="strong" class="card"><p class="helper">正在載入餐單…</p></lumen-card></main>';}

// Parse only arithmetic; keep exact fractions until the final rounding to cents.
function expressionHundredths(value,max,percent){
  const raw=String(value==null?'':value).trim();if(!raw)return {empty:true};
  if(raw.length>256)return {error:'算式過長，請縮短至256個字元內。'};
  const source=raw.replace(/[xX×]/g,'*');let pos=0;
  const rangeError=percent?'百分比須介乎0至100%。':'金額須介乎 HK$0.00 至 HK$1,000,000.00。';
  function skip(){while(/\s/.test(source[pos]||'')&&pos<source.length)pos++;}
  function fail(message){throw new Error(message||'算式未完成或格式不正確，請使用數字及 +、-、x、*、/。');}
  function primary(){
    skip();const sign=source[pos];
    if(sign==='+'||sign==='-'){pos++;const v=primary();return {n:sign==='-'?-v.n:v.n,d:v.d};}
    if(sign==='('){pos++;const v=sum();skip();if(source[pos]!==')')fail('括號未配對。');pos++;return v;}
    const match=/^(?:\d+(?:\.\d*)?|\.\d+)/.exec(source.slice(pos));
    if(!match)fail();pos+=match[0].length;
    const parts=match[0].split('.'),fraction=parts[1]||'';
    return {n:BigInt((parts[0]||'0')+fraction),d:10n**BigInt(fraction.length)};
  }
  function product(){
    let left=primary();
    while(true){
      skip();const op=source[pos];if(op!=='*'&&op!=='/')return left;
      pos++;const right=primary();
      if(op==='/'&&right.n===0n)fail('除數不可為0。');
      left=op==='*'?{n:left.n*right.n,d:left.d*right.d}:{n:left.n*right.d,d:left.d*right.n};
      if(left.d<0n){left.n=-left.n;left.d=-left.d;}
    }
  }
  function sum(){
    let left=product();
    while(true){
      skip();const op=source[pos];if(op!=='+'&&op!=='-')return left;
      pos++;const right=product();
      left={n:left.n*right.d+(op==='+'?right.n:-right.n)*left.d,d:left.d*right.d};
    }
  }
  try{
    const result=sum();skip();if(pos!==source.length)fail();
    if(result.n<0n||result.n*100n>BigInt(max)*result.d)return {error:rangeError};
    return {hundredths:Number((result.n*200n+result.d)/(result.d*2n))};
  }catch(error){return {error:error.message};}
}
function moneyCents(value){
  const parsed=expressionHundredths(value,100000000,false);
  return parsed.error||parsed.empty?parsed:{cents:parsed.hundredths};
}
function percentBps(value){
  const parsed=expressionHundredths(value,10000,true);
  return parsed.error||parsed.empty?parsed:{basisPoints:parsed.hundredths};
}
function previewAmount(input,kind){
  if(kind==='item')state.itemDraft=input.value;
  const target=document.getElementById(kind+'Calculation');if(!target)return;
  const percent=kind!=='item'&&document.getElementById(kind+'Mode').value==='percent';
  const parsed=percent?percentBps(input.value):moneyCents(input.value);
  const error=parsed.error||(kind==='item'&&!parsed.empty&&parsed.cents<=0?'餐點金額須大於 HK$0.00。':'');
  input.setAttribute('aria-invalid',error?'true':'false');
  target.textContent=error||(parsed.empty?(kind==='item'?'支援 +、−、x、*、/ 及括號，先乘除後加減。':'請輸入數值。'):'＝ '+(percent?(parsed.basisPoints/100).toFixed(2)+'%':fmt(parsed.cents)));
  target.style.color=error?'hsl(var(--danger))':'';
  if(kind==='item')updateSelectionFeedback();
}
function updateSelectionFeedback(){
  const people=(state.session&&state.session.participants||[]).filter(function(name){return state.selected.has(name);});
  const preview=document.getElementById('sharePreview');
  if(!preview)return;
  const input=document.getElementById('itemAmount'),parsed=moneyCents(input&&input.value);
  preview.textContent=!people.length?'選一人自行負責，或選多人平均分攤。':people.length===1?'由 '+people[0]+' 負責。':!parsed.error&&!parsed.empty&&parsed.cents>0?people.length+' 人平均分攤，每人約 '+fmt(Math.round(parsed.cents/people.length))+'。':people.length+' 人平均分攤。';
}
function rememberSection(open){state.showAdjustments=open;}
function rememberParticipantDraft(value){state.participantDraft=value;}
function allocate(total,weights){
  const names=Object.keys(weights).filter(function(name){return Number(weights[name])>0;});
  const out=Object.create(null);Object.keys(weights).forEach(function(name){out[name]=0;});
  const weightTotal=names.reduce(function(sum,name){return sum+Number(weights[name]);},0);
  if(!names.length||!total||weightTotal<=0)return out;
  const denom=BigInt(weightTotal),sum=BigInt(total);
  const rows=names.map(function(name,index){const product=sum*BigInt(weights[name]);return{name:name,index:index,cents:Number(product/denom),remainder:product%denom};});
  let rest=total-rows.reduce(function(acc,row){return acc+row.cents;},0);
  rows.sort(function(a,b){if(a.remainder===b.remainder)return a.index-b.index;return a.remainder>b.remainder?-1:1;});
  for(let i=0;i<rest&&i<rows.length;i++)rows[i].cents++;
  rows.forEach(function(row){out[row.name]=row.cents;});return out;
}
function readAdjustment(mode,value,subtotal){
  if(mode==='percent')return {cents:Number((BigInt(subtotal)*BigInt(value||0)+5000n)/10000n)};
  return {cents:Number(value||0)};
}
function calculate(itemsOverride){
  const session=state.session,people=(session&&Array.isArray(session.participants)?session.participants:[]);
  const items=Array.isArray(itemsOverride)?itemsOverride:state.items;
  const base=Object.create(null);people.forEach(function(name){base[name]=0;});
  items.forEach(function(item){
    const recipients=uniqueNames(item.responsible).filter(function(name){return Object.prototype.hasOwnProperty.call(base,name);});
    const weights=Object.create(null);recipients.forEach(function(name){weights[name]=1;});
    const parts=allocate(Number(item.amount)||0,weights);recipients.forEach(function(name){base[name]+=parts[name]||0;});
  });
  const subtotal=Object.keys(base).reduce(function(sum,name){return sum+base[name];},0);
  const serviceResult=readAdjustment(session&&session.serviceMode,session&&session.serviceValue,subtotal);
  const discountResult=readAdjustment(session&&session.discountMode,session&&session.discountValue,subtotal);
  const errors=[];
  if(discountResult.cents>subtotal)errors.push('折扣不可多於餐點小計。');
  const service=allocate(serviceResult.cents,base);
  const discountAllocation=session&&session.discountAllocation||'proportional';
  let discount;
  if(discountAllocation==='equal'){
    const payingPeople=Object.create(null);
    people.forEach(function(name){if(base[name]>0)payingPeople[name]=1;});
    discount=allocate(discountResult.cents,payingPeople);
  }else if(discountAllocation==='person'){
    discount=Object.create(null);people.forEach(function(name){discount[name]=0;});
    const recipient=session&&session.discountRecipient;
    if(discountResult.cents>0&&(!recipient||!Object.prototype.hasOwnProperty.call(base,recipient)||base[recipient]<=0)){
      errors.push('請選擇有餐點金額的人享有全部折扣。');
    }else if(recipient&&Object.prototype.hasOwnProperty.call(base,recipient)){
      discount[recipient]=discountResult.cents;
      if(discountResult.cents>base[recipient])errors.push('指定對象的餐點小計不足以承受全部折扣，請調低折扣或改選其他人。');
    }
  }else discount=allocate(discountResult.cents,base);
  const due=Object.create(null);people.forEach(function(name){due[name]=(base[name]||0)+(service[name]||0)-(discount[name]||0);});
  return{base:base,subtotal:subtotal,serviceTotal:serviceResult.cents,discountTotal:discountResult.cents,service:service,discount:discount,due:due,total:subtotal+serviceResult.cents-discountResult.cents,errors:errors};
}

function adjustmentSummary(m){
  const parts=[];
  if(m.serviceValue)parts.push('服務費 '+(m.serviceMode==='percent'?(m.serviceValue/100)+'%':fmt(m.serviceValue)));
  if(m.discountValue)parts.push('折扣 '+(m.discountMode==='percent'?(m.discountValue/100)+'%':fmt(m.discountValue)));
  return parts.join(' · ')||'未加服務費或折扣';
}

    '<div class="summary-breakdown"><div class="breakdown-line"><span>餐點小計</span><strong>'+fmt(result.subtotal)+'</strong></div>'+(result.serviceTotal?'<div class="breakdown-line"><span>服務費</span><strong>+'+fmt(result.serviceTotal)+'</strong></div>':'')+(result.discountTotal?'<div class="breakdown-line"><span>折扣</span><strong>−'+fmt(result.discountTotal)+'</strong></div>':'')+'</div>'+

function renderAdjustmentControl(kind,title,mode,value,disabled){
  const number=mode==='percent'?(Number(value||0)/100).toFixed(2).replace(/\.?0+$/,''):amountText(value);
  let distribution='';
  if(kind==='discount'){
    const allocation=state.session&&state.session.discountAllocation||'proportional';
    const recipient=state.session&&state.session.discountRecipient||'';
    const result=calculate(),people=state.session&&state.session.participants||[];
    const options=people.map(function(name){
      const amount=result.base[name]||0,tooSmall=amount<result.discountTotal;
      const unavailable=amount<=0||tooSmall;
      const note=amount<=0?'（沒有餐點金額）':(tooSmall?'（餐點小計不足）':'（餐點 '+fmt(amount)+'）');
      return '<option value="'+esc(name)+'" '+(recipient===name?'selected ':'')+(unavailable?'disabled':'')+'>'+esc(name)+note+'</option>';
    }).join('');
    const emptyOption=people.includes(recipient)?'':'<option value="" selected disabled>選擇折扣對象</option>';
    distribution='<div class="discount-allocation"><label for="discountAllocation">折扣分配方式</label><select id="discountAllocation" aria-label="折扣分配方式" onchange="saveDiscountAllocation(this.value)" '+(disabled?'disabled':'')+'><option value="proportional" '+(allocation==='proportional'?'selected':'')+'>按金額比例分攤（預設）</option><option value="equal" '+(allocation==='equal'?'selected':'')+'>按有餐點金額的人數均分</option><option value="person" '+(allocation==='person'?'selected':'')+'>指定一人享有全部折扣</option></select></div>'+
      (allocation==='person'?'<div class="discount-allocation"><label for="discountRecipient">折扣對象</label><select id="discountRecipient" aria-label="折扣對象" onchange="saveDiscountRecipient(this.value)" '+(disabled?'disabled':'')+'>'+emptyOption+options+'</select><p class="helper">指定對象的餐點小計須足以抵扣全部折扣；沒有餐點金額的人不列入。</p></div>':'');
  }
  return '<div class="adjust-box"><div class="adjust-title"><label for="'+kind+'Value">'+title+'</label><span>'+fmt(kind==='service'?calculate().serviceTotal:calculate().discountTotal)+'</span></div>'+
    '<div class="adjust-input"><input type="text" inputmode="text" maxlength="256" autocomplete="off" spellcheck="false" id="'+kind+'Value" value="'+esc(number)+'" aria-label="'+title+'數值" aria-describedby="'+kind+'Calculation" oninput="previewAmount(this,\''+kind+'\')" onchange="saveAdjustment(\''+kind+'\')" '+(disabled?'disabled':'')+'>'+
    '<select id="'+kind+'Mode" aria-label="'+title+'輸入方式" onchange="saveAdjustment(\''+kind+'\')" '+(disabled?'disabled':'')+'><option value="percent" '+(mode==='percent'?'selected':'')+'>百分比</option><option value="amount" '+(mode==='amount'?'selected':'')+'>實際金額</option></select></div>'+
    distribution+'<p id="'+kind+'Calculation" class="helper adjust-feedback" role="status" aria-live="polite"></p></div>';
}
function renderError(message){appEl.innerHTML='<main class="shell">'+modeHeader()+'<lumen-card variant="glass" glass="strong" class="card"><div class="warning">'+esc(message)+'</div></lumen-card></main>';}
async function createDirectSession(){
  if(state.creatingSession)return;
  state.creatingSession=true;showLoading();
  try{
    const ref=doc(collection(db,'diningSessions'));
    await setDoc(ref,{name:'餐飲分單',participants:DEFAULT_PARTICIPANTS,payer:'A',serviceMode:'percent',serviceValue:0,discountMode:'percent',discountValue:0,discountAllocation:'proportional',discountRecipient:null,archived:false,createdAt:Date.now()});
    history.replaceState(null,'',location.pathname+location.search+'#/d/'+encodeURIComponent(ref.id));
    await boot();
  }catch(error){
    console.error('開啟餐飲分單失敗',error);
    renderError(error&&error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單，請先更新資料庫 Rules。':'無法開啟餐飲分單，請檢查網絡後再試。');
  }finally{state.creatingSession=false;}
}
async function boot(){
  clearSubscriptions();state.session=null;state.items=[];state.selected=new Set();state.editItemId=null;state.itemDraft='';state.showPeopleManage=false;state.showAdjustments=false;state.participantDraft='';state.statusMessage='';
  const id=diningId();if(!id){await createDirectSession();return;}
  showLoading();const sessionRef=doc(db,'diningSessions',id);
  state.unsub.push(onSnapshot(sessionRef,function(snapshot){
    if(!snapshot.exists()){state.session=false;renderError('找不到這張餐單，請檢查分享連結。');return;}
    state.session=Object.assign({id:id},snapshot.data());
    if(!Array.isArray(state.session.participants))state.session.participants=[];
    renderActive();
  },function(error){console.error(error);renderError(error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單資料，請先更新資料庫 Rules。':'載入餐單失敗，請檢查網絡後再試。');}));
  const itemsQuery=query(collection(db,'diningSessions',id,'items'),orderBy('createdAt','asc'));
  state.unsub.push(onSnapshot(itemsQuery,function(snapshot){
    state.items=snapshot.docs.map(function(row){return Object.assign({id:row.id},row.data());}).sort(function(a,b){return Number(a.createdAt||0)-Number(b.createdAt||0)||String(a.id).localeCompare(String(b.id));});
    if(state.session)renderActive();
  },function(error){console.error(error);renderError(error.code==='permission-denied'?'Firestore Rules 尚未開放餐飲分單餐點資料，請先更新資料庫 Rules。':'載入餐點失敗，請檢查網絡後再試。');}));
}
function clearSubscriptions(){state.unsub.forEach(function(unsub){unsub();});state.unsub=[];}
function toggleAssignee(input){if(input.checked)state.selected.add(input.value);else state.selected.delete(input.value);updateSelectionFeedback();}
function selectAllAssignees(){state.selected=new Set(state.session.participants||[]);renderActive();}
function clearAssignees(){state.selected.clear();renderActive();}
function clearAmountInput(){
  const input=document.getElementById('itemAmount');state.itemDraft='';
  if(input){input.value='';previewAmount(input,'item');input.focus();}
}
async function clearDiningAmounts(){
  if(!state.session||state.session.archived||state.bulkAction)return;
  if(!confirm('確定清空這張餐單的所有餐點金額，並將服務費及折扣歸零？參加者名單會保留。此操作不能復原。'))return;
  const id=diningId();state.bulkAction=true;renderActive();setStatus('正在清空金額…');
  try{
    const snapshot=await getDocsFromServer(collection(db,'diningSessions',id,'items'));
    // Keep each batch below Firestore's write limit, including the final session update.
    for(let offset=0;offset<snapshot.docs.length;offset+=450){
      const batch=writeBatch(db);
      snapshot.docs.slice(offset,offset+450).forEach(function(row){batch.delete(row.ref);});
      if(offset+450>=snapshot.docs.length)batch.update(doc(db,'diningSessions',id),{serviceValue:0,discountValue:0});
      await batch.commit();
    }
    if(!snapshot.docs.length)await updateDoc(doc(db,'diningSessions',id),{serviceValue:0,discountValue:0});
    if(diningId()===id){state.itemDraft='';state.editItemId=null;}
  }catch(error){showWriteError('清空金額未能全部完成，請重新檢查餐單後再試',error);}
  finally{state.bulkAction=false;if(diningId()===id)renderActive();}
}
async function clearAllParticipants(){
  if(!state.session||state.session.archived||state.bulkAction||!state.session.participants.length)return;
  if(state.items.length){alert('請先按「清空金額」移除所有餐點，再清空參加者，以免留下無人分攤的餐點。');return;}
  if(!confirm('確定清空這張餐單的所有參加者？已儲存的本機名單會保留。此操作不能復原。'))return;
  const id=diningId();state.bulkAction=true;renderActive();
  try{
    const items=await getDocsFromServer(query(collection(db,'diningSessions',id,'items'),limit(1)));
    if(!items.empty){alert('餐單中仍有餐點，請先按「清空金額」再清空參加者。');return;}
    await updateDoc(doc(db,'diningSessions',id),{participants:[],payer:null,discountAllocation:'proportional',discountRecipient:null});
    if(diningId()===id)state.selected.clear();
  }catch(error){showWriteError('清空參加者失敗',error);}
  finally{state.bulkAction=false;if(diningId()===id)renderActive();}
}
async function addParticipant(event){
  event.preventDefault();const input=document.getElementById('newParticipant'),name=(input.value||'').trim();
  if(!name){input.focus();return;}if(name.length>30){alert('參加者名稱不可超過30個字。');return;}
  let committedParticipants=null,replacement=null;
  try{
    await runTransaction(db,async function(tx){
      const ref=doc(db,'diningSessions',diningId()),snap=await tx.get(ref);
      if(!snap.exists())throw new Error('missing');
      const current=uniqueNames(snap.data().participants);
      if(current.some(function(row){return row.toLocaleLowerCase()===name.toLocaleLowerCase();}))throw new Error('duplicate');
      const merged=mergeParticipantNames(current,[name]);
      replacement=merged.replaced[0]||null;
      if(replacement&&state.items.some(function(item){return (item.responsible||[]).includes(replacement.from);}))throw new Error('default-in-use');
      if(!replacement&&current.length>=100)throw new Error('max');
      committedParticipants=merged.participants;
      const payer=replacement&&snap.data().payer===replacement.from?name:(snap.data().payer||name);
      const updates={participants:committedParticipants,payer:payer};
      if(replacement&&snap.data().discountAllocation==='person'&&snap.data().discountRecipient===replacement.from)updates.discountRecipient=name;
      tx.update(ref,updates);
    });
  }catch(error){if(error.message==='duplicate')alert('這個名字已存在。');else if(error.message==='max')alert('參加者最多100人。');else if(error.message==='default-in-use')alert('預設人員「'+(replacement&&replacement.from||'')+'」已有負責的餐點，請先移除或修改相關餐點，再新增姓名取代。');else showWriteError('新增參加者失敗',error);return;}
  state.participantDraft='';
  if(replacement)state.selected.delete(replacement.from);
  state.selected.add(name);
  if(state.session&&committedParticipants)state.session.participants=committedParticipants;
  renderActive();
}
async function removeParticipant(name){
  if(state.items.some(function(item){return (item.responsible||[]).includes(name);})) {alert('這位參加者已有負責的餐點，請先移除或更改相關餐點分攤。');return;}
  const people=state.session.participants||[];
  if(people.length<=1){alert('餐單至少需要保留一位參加者。');return;}
  if(!confirm('確定移除參加者「'+name+'」？'))return;
  const next=people.filter(function(row){return row!==name;});
  const payer=state.session.payer===name?(next[0]||null):state.session.payer;
  const updates={participants:next,payer:payer};
  if(state.session.discountAllocation==='person'&&state.session.discountRecipient===name){updates.discountAllocation='proportional';updates.discountRecipient=null;}
  try{await updateDoc(doc(db,'diningSessions',diningId()),updates);}
  catch(error){showWriteError('移除參加者失敗',error);}
}
function togglePeopleManage(){state.showPeopleManage=!state.showPeopleManage;renderActive();const target=document.getElementById(state.showPeopleManage?'newParticipant':'manageNamesToggle');if(target)target.focus();}
async function saveCurrentRoster(){
  const people=uniqueNames(state.session&&state.session.participants);
  if(!people.length){setStatus('目前沒有參加者可儲存。');return;}
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(people));setStatus('已儲存 '+people.length+' 位參加者至此瀏覽器。');}
  catch(error){setStatus('無法在此瀏覽器儲存名單。');}
}
async function loadRosterIntoSession(){
  const saved=loadSavedParticipants();if(!saved.length){setStatus('此瀏覽器尚未儲存參加者名單。');return;}
  let committedParticipants=null,replacedNames=[];
  try{
    await runTransaction(db,async function(tx){
      const ref=doc(db,'diningSessions',diningId()),snap=await tx.get(ref);
      if(!snap.exists())throw new Error('missing');
      const current=uniqueNames(snap.data().participants),merged=mergeParticipantNames(current,saved);
      replacedNames=merged.replaced;
      const inUse=replacedNames.find(function(row){return state.items.some(function(item){return (item.responsible||[]).includes(row.from);});});
      if(inUse)throw new Error('default-in-use:'+inUse.from);
      if(merged.unadded.length)throw new Error('max');
      committedParticipants=merged.participants;
      const oldPayer=snap.data().payer;
      const payerReplacement=replacedNames.find(function(row){return row.from===oldPayer;});
      const payer=payerReplacement?payerReplacement.to:oldPayer;
      const oldRecipient=snap.data().discountRecipient;
      const recipientReplacement=replacedNames.find(function(row){return row.from===oldRecipient;});
      const updates={participants:committedParticipants,payer:payer||committedParticipants[0]||null};
      if(recipientReplacement)updates.discountRecipient=recipientReplacement.to;
      tx.update(ref,updates);
    });
    if(state.session&&committedParticipants)state.session.participants=committedParticipants;
    replacedNames.forEach(function(row){if(state.selected.has(row.from)){state.selected.delete(row.from);state.selected.add(row.to);}});
    renderActive();setStatus('已依序取代預設人員，並加入本機名單。');
  }catch(error){if(error.message==='max')setStatus('載入後人數會超過100人。');else if(error.message.startsWith('default-in-use:'))alert('預設人員「'+error.message.split(':')[1]+'」已有負責的餐點，請先移除或修改相關餐點，再載入名單。');else showWriteError('載入名單失敗',error);}
}
async function saveAdjustment(kind){
  const modeEl=document.getElementById(kind+'Mode'),valueEl=document.getElementById(kind+'Value');
  if(!modeEl||!valueEl)return;
  const mode=modeEl.value,parsed=mode==='percent'?percentBps(valueEl.value):moneyCents(valueEl.value);
  if(parsed.error||parsed.empty){alert(parsed.error||'請輸入數值。');previewAmount(valueEl,kind);valueEl.focus();return;}
  const value=mode==='percent'?parsed.basisPoints:parsed.cents;
  const current=calculate();
  if(kind==='discount'&&mode==='amount'&&value>current.subtotal){alert('折扣不可多於餐點小計。');renderActive();return;}
  if(kind==='discount'&&(state.session.discountAllocation||'proportional')==='person'){
    const proposed=readAdjustment(mode,value,current.subtotal).cents,recipient=state.session.discountRecipient;
    if(proposed>0&&(!recipient||current.base[recipient]<proposed)){alert('指定對象的餐點小計不足以承受全部折扣，請先改選折扣對象或調低折扣。');renderActive();return;}
  }
  try{await updateDoc(doc(db,'diningSessions',diningId()),{[kind+'Mode']:mode,[kind+'Value']:value});}
  catch(error){showWriteError('儲存設定失敗',error);}
}
async function saveDiscountAllocation(value){
  if(!['proportional','equal','person'].includes(value)){renderActive();return;}
  const updates={discountAllocation:value,discountRecipient:null};
  if(value==='person'){
    const result=calculate(),people=state.session.participants||[];
    const current=state.session.discountRecipient;
    const canUse=function(name){return (result.base[name]||0)>=result.discountTotal&&(result.discountTotal===0||(result.base[name]||0)>0);};
    const recipient=people.includes(current)&&canUse(current)?current:people.find(canUse);
    if(!recipient){alert('目前沒有人有足夠餐點小計承受全部折扣。請先加入餐點或調低折扣。');renderActive();return;}
    updates.discountRecipient=recipient;
  }
  try{await updateDoc(doc(db,'diningSessions',diningId()),updates);}
  catch(error){showWriteError('儲存折扣分配方式失敗',error);renderActive();}
}
async function saveDiscountRecipient(value){
  const result=calculate();
  if(!(state.session.participants||[]).includes(value)){alert('請選擇餐單中的參加者。');renderActive();return;}
  if((result.base[value]||0)<result.discountTotal){alert('此人的餐點小計不足以承受全部折扣，請改選其他人或調低折扣。');renderActive();return;}
  try{await updateDoc(doc(db,'diningSessions',diningId()),{discountRecipient:value});}
  catch(error){showWriteError('修改折扣對象失敗',error);renderActive();}
}
async function saveItem(event){
  event.preventDefault();
  const input=document.getElementById('itemAmount'),parsed=moneyCents(input.value);
  const people=(state.session.participants||[]).filter(function(name){return state.selected.has(name);});
  if(parsed.error||parsed.empty||parsed.cents<=0){alert(parsed.error||'請輸入大於 HK$0.00 的金額。');return;}
  if(!people.length){alert('請至少選一位負責人；共享餐點可選多位或按「全選」。');return;}
  const data={amount:parsed.cents,responsible:people};
  const projected=state.items.slice();
  if(state.editItemId){const index=projected.findIndex(function(item){return item.id===state.editItemId;});if(index>=0)projected[index]=Object.assign({},projected[index],data);}
  else projected.push(data);
  const projectedResult=calculate(projected);
  if(projectedResult.errors.some(function(message){return message.indexOf('指定對象的餐點小計不足')>=0;})){alert('這項變更會令折扣對象的餐點小計不足以承受全部折扣，請先改選折扣對象或調低折扣。');return;}
  try{
    if(state.editItemId){
      const existing=state.items.find(function(item){return item.id===state.editItemId;});
      data.createdAt=Number(existing&&existing.createdAt)||Date.now();
      await updateDoc(doc(db,'diningSessions',diningId(),'items',state.editItemId),data);
    }else{data.createdAt=Date.now();await addDoc(collection(db,'diningSessions',diningId(),'items'),data);}
    state.editItemId=null;state.itemDraft='';state.selected=new Set();renderActive();
    const nextAmount=document.getElementById('itemAmount');if(nextAmount)nextAmount.focus({preventScroll:true});
  }catch(error){showWriteError('儲存餐點失敗',error);}
}
function editItem(id){
  const item=state.items.find(function(row){return row.id===id;});if(!item)return;
  state.itemDraft=amountText(item.amount);state.editItemId=id;state.selected=new Set(item.responsible||[]);renderActive();
  const amount=document.getElementById('itemAmount');if(amount)amount.focus();
}
function cancelItemEdit(){state.editItemId=null;state.itemDraft='';state.selected=new Set();renderActive();}
async function removeItem(id){
  if(!confirm('確定移除這項餐點？'))return;
  const projected=state.items.filter(function(item){return item.id!==id;});
  const projectedResult=calculate(projected);
  if(projectedResult.errors.some(function(message){return message.indexOf('指定對象的餐點小計不足')>=0;})){alert('移除此餐點會令折扣對象的餐點小計不足以承受全部折扣，請先改選折扣對象或調低折扣。');return;}
  try{await deleteDoc(doc(db,'diningSessions',diningId(),'items',id));}
  catch(error){showWriteError('移除餐點失敗',error);}
}
function copyLink(){
  const link=window.location.href;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(link).then(function(){setStatus('已複製餐單連結。');}).catch(function(){window.prompt('請手動複製餐單連結：',link);});}
  else window.prompt('請手動複製餐單連結：',link);
}
async function openQr(){
  const dialog=document.getElementById('qrDialog'),img=document.getElementById('qrImage'),loading=document.getElementById('qrLoading'),error=document.getElementById('qrError');
  dialog.showModal();error.hidden=true;
  try{
    if(!qrPromise)qrPromise=import('https://esm.sh/qrcode@1.5.4?bundle');
    const mod=await qrPromise,make=mod.toString||mod.default&&mod.default.toString;
    const svg=await make(window.location.href,{type:'svg',errorCorrectionLevel:'M',margin:2,width:240,color:{dark:'#202747',light:'#ffffff'}});
    state.qrData='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);img.src=state.qrData;img.hidden=false;loading.hidden=true;
  }catch(err){console.error(err);loading.hidden=true;error.textContent='QR Code 暫時無法載入，請使用複製連結。';error.hidden=false;}
}
function closeQr(){const dialog=document.getElementById('qrDialog');if(dialog.open)dialog.close();}
function copyDiningLink(){copyLink();closeQr();}
function showWriteError(action,error){
  console.error(action,error);
  if(error&&error.code==='permission-denied'){alert(action+'：Firestore Rules 尚未開放餐飲分單資料，請更新 Rules 後再試。');return;}
  alert(action+'，請檢查網絡後再試。');
}
Object.assign(window,{rememberSection,rememberParticipantDraft,clearAmountInput,clearDiningAmounts,clearAllParticipants,previewAmount,addParticipant,removeParticipant,togglePeopleManage,saveCurrentRoster,loadRosterIntoSession,saveAdjustment,saveDiscountAllocation,saveDiscountRecipient,selectAllAssignees,clearAssignees,toggleAssignee,saveItem,cancelItemEdit,editItem,removeItem,copyLink,openQr,closeQr,copyDiningLink});
window.addEventListener('hashchange',boot);
boot();
